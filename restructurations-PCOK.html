:root {
  --cyan: #25CCF6;
  --cyan-hover: #4ad8ff;
  --ink: #024a75;
  --deep: rgba(0,60,105,0.45);
  --glass: rgba(255,255,255,0.12);
  --glass-2: rgba(255,255,255,0.16);
  --line: rgba(255,255,255,0.42);
  --bad-bg: rgba(255,120,120,0.28);
  --bad: #ff9a9a;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: #0190d0; }
body { min-height: 100vh; min-height: 100dvh; background: transparent; color: #ffffff; font-family: Figtree, Helvetica, Arial, sans-serif; font-weight: 700; text-wrap: pretty; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }

/* Fond : identique au jeu des budgets */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(148deg, #004e88 0%, #006dbf 26%, #0190d0 56%, #16b6ec 82%, #25CCF6 100%); }
.bg::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 92% 84%, rgba(37,204,246,0.45) 0%, rgba(37,204,246,0) 70%); }
.bg::after { content: ""; position: absolute; inset: -4px; background-image: radial-gradient(circle, rgba(255,255,255,0.16) 1.2px, rgba(255,255,255,0) 2px); background-size: 26px 26px; }
.orb { position: fixed; z-index: 0; pointer-events: none; border-radius: 50%; background: #ffffff; box-shadow: 0 0 40px 12px rgba(255,255,255,0.10); }

/* Accueil */
.stats { display: flex; align-items: stretch; }

.zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.zone1 { cursor: pointer; min-height: 120px; padding: 14px 12px; border-radius: 20px; border: 2px dashed rgba(255,255,255,0.6); background: var(--glass); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; transition: background 0.15s ease, transform 0.15s ease; }

.drag-card { cursor: grab; align-self: center; width: 100%; padding: 14px 16px; border-radius: 18px; background: #ffffff; color: var(--ink); font-size: 16px; font-weight: 800; line-height: 1.3; text-align: center; box-shadow: 0 12px 28px rgba(0,45,80,0.3); touch-action: none; user-select: none; -webkit-user-select: none; }

.fb { padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); background: var(--deep); display: flex; flex-direction: column; gap: 8px; animation: hi-rise 0.3s ease; }

.bar-in .btn { flex: 1; padding: 12px 16px; font-size: 15px; box-shadow: none; }

/* Tableaux à compléter (chapitres 2 et 3) */
.board-title { text-align: center; font-size: 20px; font-weight: 900; letter-spacing: -0.01em; }
.bilan { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.zone { cursor: pointer; min-height: 66px; padding: 10px 10px; border-top: 2px dashed rgba(255,255,255,0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; transition: background 0.15s ease, transform 0.15s ease; }
.col .zone:first-child, .sect .zone.first { border-top: 0; }

.zone.good { background: #ffffff; color: var(--ink); cursor: default; border-top: 2px solid rgba(2,74,117,0.18); }

.shake { animation: shake 0.45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }

.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(0,50,90,0.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 2px solid var(--cyan); box-shadow: 0 -10px 30px rgba(0,30,60,0.35); }

const DATA = {"CH1": [{"type": "identification", "question": "Une entreprise souhaite changer sa forme juridique en passant de SARL à SAS. De quel type de restructuration s'agit-il ?", "scenario": "La société ALPHA SARL décide de transformer sa structure juridique pour devenir ALPHA SAS.", "visual": "modification", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 0, "explanation": "Il s'agit d'une <strong>modification des statuts par changement juridique<\/strong>. L'entreprise reste la même entité mais change simplement sa forme juridique (SARL → SAS). C'est la restructuration la plus simple : même nom, même activité, mais nouvelles règles de fonctionnement.", "visualExplanation": {"before": "ALPHA", "beforeLabel": "SARL", "after": "ALPHA", "afterLabel": "SAS", "arrow": "→", "note": "Même entreprise, nouvelle forme"}}, {"type": "disparition", "question": "Dans une modification des statuts (changement juridique), l'entité d'origine disparaît-elle ?", "choices": ["Non, l'entité continue d'exister sous une nouvelle forme juridique", "Oui, une nouvelle entité est créée", "Cela dépend du type de modification", "Oui, mais seulement si c'est une transformation en SA"], "correct": 2, "explanation": "<strong>Cela dépend du type de modification.<\/strong><br><br><strong>Règle générale :<\/strong> Une entité ne \"disparaît\" que si elle est formellement fermée (radiation, dissolution/liquidation). Modifier des statuts ne suffit pas.<br><br><strong>Si on reste dans la même famille juridique :<\/strong> Il y a continuité, l'entité reste la même. Exemple : société commerciale → société commerciale (SARL → SAS).<br><br><strong>Si on change de famille juridique :<\/strong> Ce n'est pas une transformation : on crée une nouvelle entité, puis on transfère l'activité/actifs si besoin. L'ancienne ne disparaît que si on la ferme. Exemples : micro-entreprise (EI) → société (SAS) ; société commerciale → association (loi 1901)."}, {"type": "identification", "question": "Deux sociétés décident de se regrouper : la société BETA absorbe la société GAMMA. Quelle restructuration décrit cette situation ?", "scenario": "La société BETA rachète et intègre intégralement la société GAMMA. Tous les actifs de GAMMA sont transférés à BETA.", "visual": "fusion-absorption", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 1, "explanation": "C'est une <strong>fusion absorption<\/strong> : BETA (société absorbante) intègre entièrement GAMMA (société absorbée). Les actifs, passifs et salariés de GAMMA sont transférés à BETA qui continue d'exister.", "visualExplanation": {"entityA": "BETA", "entityB": "GAMMA", "result": "BETA", "resultLabel": "(agrandie)", "note": "BETA absorbe GAMMA"}}, {"type": "disparition", "question": "Dans une fusion absorption, quelles entités disparaissent ?", "choices": ["Uniquement la société absorbée", "Uniquement la société absorbante", "Les deux sociétés disparaissent", "Aucune société ne disparaît"], "correct": 0, "explanation": "Seule la <strong>société absorbée disparaît<\/strong>. La société absorbante continue d'exister et récupère tous les éléments de la société absorbée (patrimoine, contrats, salariés)."}, {"type": "identification", "question": "Deux entreprises, DELTA et EPSILON, décident de fusionner pour créer une nouvelle société ZETA. De quelle restructuration s'agit-il ?", "scenario": "DELTA et EPSILON mettent en commun leurs actifs pour créer ZETA, une entité entièrement nouvelle.", "visual": "fusion-creation", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 2, "explanation": "C'est une <strong>fusion création<\/strong> : deux (ou plusieurs) sociétés existantes fusionnent pour créer une société entièrement nouvelle. Les sociétés d'origine sont remplacées par la nouvelle entité.", "visualExplanation": {"entityA": "DELTA", "entityB": "EPSILON", "result": "ZETA", "resultLabel": "nouvelle société", "note": "Création d'une nouvelle entité"}}, {"type": "disparition", "question": "Dans une fusion création, combien d'entités disparaissent ?", "choices": ["Aucune entité ne disparaît", "Une seule entité disparaît", "Toutes les entités qui fusionnent disparaissent", "Cela dépend du nombre d'entités impliquées"], "correct": 2, "explanation": "<strong>Toutes les sociétés qui fusionnent disparaissent<\/strong> pour donner naissance à une société entièrement nouvelle. Si 3 sociétés fusionnent, les 3 disparaissent pour créer une 4ème société."}, {"type": "identification", "question": "La société KAPPA se divise en deux sociétés distinctes : KAPPA 1 et KAPPA 2. Quelle est cette opération ?", "scenario": "L'entreprise KAPPA décide de séparer ses activités en deux branches indépendantes pour devenir KAPPA 1 et KAPPA 2.", "visual": "scission", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 3, "explanation": "C'est une <strong>scission<\/strong> : une société existante se divise pour créer plusieurs sociétés nouvelles. C'est l'inverse de la fusion : au lieu de regrouper, on sépare.", "visualExplanation": {"before": "KAPPA", "beforeLabel": "société unique", "results": ["KAPPA 1", "KAPPA 2"], "note": "KAPPA est divisée en 2"}}, {"type": "disparition", "question": "Lors d'une scission, la société qui se divise continue-t-elle d'exister ?", "choices": ["Oui, elle continue d'exister aux côtés des nouvelles entités", "Non, elle disparaît et est remplacée par les nouvelles entités", "Oui, mais sous une forme juridique différente", "Cela dépend du nombre de divisions"], "correct": 1, "explanation": "La société d'origine <strong>disparaît complètement<\/strong>. Elle est remplacée par plusieurs sociétés nouvelles qui se répartissent son patrimoine, ses activités et ses salariés."}, {"type": "identification", "question": "La société LAMBDA transfère une partie de son activité (sa branche logistique) à la société MU. LAMBDA continue d'exister avec ses autres activités. Quelle restructuration est-ce ?", "scenario": "LAMBDA conserve ses activités commerciales mais transfère toute sa branche logistique (bâtiments, camions, personnel logistique) à MU.", "visual": "apport-partiel", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 4, "explanation": "C'est un <strong>apport partiel d'actif<\/strong> : LAMBDA transfère une branche autonome d'activité à MU, mais continue d'exister. Seule une partie précise de l'entreprise change de main (ici : la logistique).", "visualExplanation": {"before": "LAMBDA", "beforeLabel": "(commerce + logistique)", "arrow": "→", "after": "MU", "afterLabel": "(reçoit logistique)", "remainingBefore": "LAMBDA", "remainingBeforeLabel": "(commerce)"}}, {"type": "disparition", "question": "Dans un apport partiel d'actif, l'entreprise qui apporte une partie de son activité disparaît-elle ?", "choices": ["Oui, elle disparaît complètement", "Non, elle continue d'exister avec ses activités restantes", "Oui, mais seulement si l'apport représente plus de 50% de son activité", "Elle devient une filiale de la société bénéficiaire"], "correct": 1, "explanation": "<strong>Aucune disparition<\/strong> : la société apporteuse continue d'exister. Elle transfert seulement une branche d'activité autonome mais conserve le reste de ses activités. Les deux entreprises coexistent."}, {"type": "identification", "question": "La société NU acquiert 70% des parts de la société XI. XI devient une filiale de NU. Quelle est cette opération ?", "scenario": "NU acquiert la majorité du capital de XI, qui devient sa filiale. XI garde son nom, ses statuts, son existence juridique.", "visual": "prise-participation", "choices": ["Modification des statuts (changement juridique)", "Fusion absorption", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 5, "explanation": "C'est une <strong>prise de participation<\/strong> (ou prise de contrôle) : NU acquiert des parts de XI pour en devenir l'actionnaire majoritaire. XI devient une filiale mais reste une entité juridique distincte. Pas de fusion, pas de transfert d'activité.", "visualExplanation": {"parent": "NU", "parentLabel": "(société mère)", "subsidiary": "XI", "subsidiaryLabel": "(filiale)", "connection": "acquiert 70% des parts", "note": "NU prend le contrôle de XI"}}, {"type": "disparition", "question": "Lors d'une prise de participation, la société dont les parts sont acquises disparaît-elle ?", "choices": ["Oui, elle est absorbée par la société mère", "Non, elle conserve son existence juridique propre", "Oui, si la participation est supérieure à 50%", "Elle devient une simple division de la société mère"], "correct": 1, "explanation": "<strong>Aucune disparition<\/strong> : la filiale reste une société juridiquement distincte avec son propre SIRET, ses propres statuts, ses propres organes de direction. Seul son actionnariat change."}], "CH2": [{"question": "Première étape : Qualifiez le type de restructuration dont il s'agit.", "context": "<strong>Rappel du cas :<\/strong> La société A est absorbée par la société B par le transfert de l'intégralité de son patrimoine.", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\"><strong>Pour vous guider :<\/strong><br>Repensez aux 6 types de restructurations que vous avez étudiés au Chapitre 1.<\/div>", "choices": ["Fusion absorption", "Modification des statuts (changement juridique)", "Fusion création", "Scission", "Apport partiel d'actif", "Prise de participation"], "correct": 0, "explanation": "<strong>C'est une fusion absorption<\/strong> : la société A (absorbée) transfère l'intégralité de son patrimoine à la société B (absorbante).<br><br>Maintenant que nous avons qualifié la restructuration, une question importante se pose : <strong>Quelle(s) société(s) disparaît/disparaissent dans cette opération ?<\/strong>", "nextQuestionIntro": true}, {"question": "Dans cette fusion absorption, quelle(s) société(s) disparaît/disparaissent ?", "context": "<strong>Rappel :<\/strong> Fusion absorption = Société A absorbée par Société B", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\"><strong>Principe de la fusion absorption :<\/strong><br>Dans une fusion absorption, une société (absorbante) intègre une autre société (absorbée) en récupérant l'intégralité de son patrimoine.<br><br><strong>Question clé :<\/strong> Qu'advient-il de la personnalité juridique de chaque société ?<\/div>", "choices": ["Les deux sociétés A et B disparaissent", "Uniquement la société B (absorbante) disparaît", "Aucune société ne disparaît, elles coexistent", "Uniquement la société A (absorbée) disparaît au profit de B (absorbante)"], "correct": 3, "explanation": "<strong>Uniquement la société A (absorbée) disparaît au profit de la société B (absorbante).<\/strong><br><br><strong>Mécanisme juridique :<\/strong><br>• La société A cesse d'exister en tant que personne morale<br>• La société B continue d'exister et intègre tout le patrimoine de A (actifs, passifs, contrats, salariés)<br>• B s'agrandit mais conserve son identité juridique<br><br><strong>Conséquence importante :<\/strong> Même si A disparaît juridiquement, cela ne signifie pas forcément que son CSE disparaît ! C'est ce que nous allons étudier maintenant."}, {"question": "Le CSE de la société A est-il maintenu après la fusion absorption ? Et si oui, sous quelle forme ?", "context": "<strong>Éléments factuels :<\/strong><ul><li>Nouveau numéro SIRET attribué à A<\/li><li>A garde ses locaux et son fonctionnement<\/li><li>Le chef d'entreprise A conserve son autonomie de gestion du personnel<\/li><\/ul>", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\">\n <strong>Notion clé : L'établissement distinct<\/strong><br><br><strong>Principe :<\/strong> Pour que le CSE soit maintenu, il faut que son entreprise garde une autonomie juridique ou de fait.<br><br>En cas de fusion-absorption, les mandats des élus du CSE de l'entreprise absorbée <strong>prennent fin<\/strong> parce que l'entreprise disparaît et ne conserve aucune autonomie.<br><br><strong>Exception :<\/strong> Si l'entité absorbée devient ou demeure un <strong>établissement distinct autonome<\/strong> au sein de l'entreprise absorbante, les mandats des élus du CSE d'établissement sont maintenus jusqu'à leur terme.<br><br><strong>2 conditions cumulatives (Article L2314-35) :<\/strong><br>1. L'entreprise A peut être qualifiée d'<strong>établissement au sens large<\/strong> de l'entreprise B<br>2. Le responsable possède une <strong>autonomie de gestion<\/strong>, notamment en matière de personnel<br><br><strong>Conséquences :<\/strong><br>Si établissement distinct → <strong>Mandats maintenus jusqu'à leur terme<\/strong><br>Si pas d'établissement distinct → <strong>Mandats expirent<\/strong> à la date de reprise\n <\/div>", "choices": ["Non, le CSE disparaît car la société A n'existe plus juridiquement", "Oui, le CSE de A devient un CSE d'établissement de B et les mandats sont maintenus", "Oui, mais seulement si un accord est signé entre les parties", "Non, il faut organiser de nouvelles élections immédiatement"], "correct": 1, "explanation": "<strong>Le CSE de A devient un CSE d'établissement de B<\/strong> et les mandats sont maintenus.<br><br><strong>Pourquoi ?<\/strong><br>Les 2 conditions de l'établissement distinct sont remplies :<br>1. <strong>Établissement au sens large :<\/strong> Nouveau SIRET → reconnaissance administrative (INSEE)<br>2. <strong>Autonomie de gestion :<\/strong> Le chef de A conserve ses pouvoirs en matière de personnel<br>3. <strong>Maintien de l'identité :<\/strong> Locaux et fonctionnement séparés<br><br><strong>Conséquence pratique :<\/strong> Vous êtes <strong>compétents<\/strong> pour étudier et porter les réclamations des salariés au niveau de l'établissement !<br><br><em>Note : La durée des mandats peut être ajustée par accord pour s'aligner sur le calendrier électoral de B (Article L2314-35).<\/em>"}, {"question": "Le salarié ne perçoit plus sa prime d'assiduité mensuelle qui était un usage d'entreprise dans la société A. A-t-il le droit de continuer à la percevoir ?", "context": "<strong>Situation :<\/strong> Prime d'assiduité mensuelle = usage d'entreprise de la société A (pratique constante, générale et fixe)", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\">\n <strong>Notion clé : Le sort des usages d'entreprise<\/strong><br><br><strong>Principe :<\/strong> Les usages sont <strong>automatiquement transmis<\/strong> au nouvel employeur lors d'une restructuration.<br><br><strong>Exceptions (2 cas) :<\/strong><br>1. <strong>Dénonciation régulière<\/strong> par le nouvel employeur<br>2. <strong>Accord anticipé ou accord d'adaptation<\/strong> ayant le même objet<br><br><strong>Procédure de dénonciation (3 étapes obligatoires) :<\/strong><br>Information du CSE<br>Information des salariés concernés<br>Respect d'un délai de prévenance suffisant<br><br><strong>Accord anticipé et accord d'adaptation :<\/strong><br>• <strong>Accord anticipé<\/strong> : conclu <strong>avant<\/strong> la restructuration pour harmoniser les statuts et éviter les disparités<br>• <strong>Accord d'adaptation<\/strong> : négocié <strong>au moment de ou après<\/strong> la mise en cause pour gérer les différences<br><br><strong>Rappel des éléments factuels :<\/strong><br>• Pas d'accord anticipé mentionné dans le cas<br>• Aucune mention de dénonciation de l'usage\n <\/div>", "choices": ["Oui, les usages sont transmis au nouvel employeur car il n'y a pas de dénonciation ou d'accord anticipé", "Non, les usages disparaissent automatiquement lors d'une fusion", "Non, sauf si un accord collectif le prévoit", "Cela dépend de la convention collective"], "correct": 0, "explanation": "<strong>Oui, le salarié doit continuer à percevoir sa prime d'assiduité.<\/strong><br><br><strong>Analyse juridique :<\/strong><br>La prime d'assiduité est un <strong>usage d'entreprise<\/strong> (pratique constante, générale et fixe)<br>Les usages sont <strong>automatiquement transmis<\/strong> lors de la fusion<br>Pas d'<strong>accord anticipé ou d'adaptation<\/strong> mentionné dans le cas<br>Aucune <strong>dénonciation régulière<\/strong> mentionnée<br><br><strong>Que doit faire la société B ?<\/strong><br>Si elle ne souhaite plus appliquer cet usage, elle doit le <strong>dénoncer<\/strong> en respectant la procédure :<br>1. Informer le CSE<br>2. Informer les salariés concernés<br>3. Respecter un délai de prévenance suffisant<br><br><strong>Sans dénonciation en bonne et due forme, la société B doit maintenir la prime.<\/strong>"}, {"question": "La direction informe le salarié que sa durée hebdomadaire de travail passe de 33h à 35h. Cette modification peut-elle lui être imposée ?", "context": "⏱ <strong>Situation :<\/strong> Durée contractuelle = 33h/semaine → Passage à 35h/semaine annoncé par la direction", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\">\n <strong>Notion clé : Le transfert légal des contrats (Article L1224-1)<\/strong><br><br><strong>Principe du transfert légal :<\/strong> Lorsqu'il y a modification dans la situation juridique de l'employeur (fusion, cession...), <strong>tous les contrats de travail en cours subsistent<\/strong> entre le nouvel employeur et le personnel.<br><br><strong>Conditions du transfert légal (2 critères cumulatifs) :<\/strong><br>1. Transfert d'une <strong>entité économique autonome<\/strong><br>2. <strong>Maintien de l'identité<\/strong> de l'entité transférée<br><br><strong>Rappel des éléments factuels :<\/strong><br>• L'intégralité de l'activité de A est maintenue et transférée<br>• A conserve ses locaux et son fonctionnement<br><br><strong>Conséquence du transfert légal :<\/strong> Le transfert est <strong>automatique<\/strong> et emporte <strong>tous les avantages contractuels<\/strong> sans formalité.<br><br><strong>Modification du contrat :<\/strong> Si le nouvel employeur souhaite modifier un élément du contrat (durée de travail, rémunération, lieu...), il doit suivre la <strong>procédure de modification du contrat de travail<\/strong> et obtenir l'<strong>accord du salarié<\/strong>.<br><br><strong>Note :<\/strong> Les accords anticipés ou accords d'adaptation ne permettent pas de modifier unilatéralement les contrats individuels.\n <\/div>", "choices": ["Oui, car la fusion permet d'harmoniser les conditions de travail", "Oui, si c'est prévu dans la convention collective", "Non, il s'agit d'une modification du contrat qui nécessite l'accord du salarié", "Non, sauf si un délai de prévenance de 3 mois est respecté"], "correct": 2, "explanation": "<strong>Non, cette modification ne peut pas être imposée au salarié.<\/strong><br><br><strong>Analyse juridique :<\/strong><br>Il s'agit d'un <strong>transfert légal<\/strong> (L1224-1) : les 2 conditions sont remplies (entité économique autonome + maintien de l'identité).<br><br><strong>Conséquence du transfert légal :<\/strong><br>Le contrat est transféré <strong>automatiquement<\/strong> avec <strong>tous ses avantages<\/strong>, y compris la durée de 33h/semaine.<br><br><strong>La durée du travail est un élément essentiel du contrat<\/strong><br>Le passage de 33h à 35h constitue une <strong>modification substantielle<\/strong> qui nécessite :<br>1. Une <strong>proposition écrite<\/strong> au salarié<br>2. Un <strong>délai de réflexion<\/strong><br>3. L'<strong>accord explicite<\/strong> du salarié<br><br><strong>Que peut faire le salarié ?<\/strong><br>• <strong>Refuser<\/strong> la modification → Maintien de 33h/semaine<br>• <strong>Accepter<\/strong> → Passage à 35h avec avenant au contrat<br><br><em>Si B impose cette modification sans accord, le salarié peut saisir le Conseil de Prud'hommes.<\/em>"}, {"question": "La fiche de paie du salarié n'indique plus la prime de panier repas prévue par un accord d'entreprise de la société B. A-t-il le droit de la percevoir ?", "context": "<strong>Situation :<\/strong> Prime de panier repas = prévue par un accord d'entreprise de la société B (l'entreprise absorbante)", "guide": "<div class=\"intro-box\" style=\"margin-top: 16px;\">\n <strong>Notion clé : La mise en cause des accords collectifs<\/strong><br><br><strong>Principe (modification de situation juridique) :<\/strong><br>En cas de fusion, absorption, cession... les accords et conventions sont <strong>automatiquement mis en cause<\/strong>.<br><br><strong>Exception importante :<\/strong><br>Les <strong>conventions de branche<\/strong> ne sont PAS mises en cause si le transfert se fait dans une entreprise de la <strong>même branche<\/strong>.<br><br><strong>⏱ Période de survie des avantages (15 mois) :<\/strong><br>En l'absence d'<strong>accord anticipé ou d'accord d'adaptation<\/strong>, les dispositions <strong>plus favorables<\/strong> des anciens statuts collectifs continuent de s'appliquer pendant <strong>15 mois<\/strong>.<br><br><strong>Pourquoi 15 mois ?<\/strong><br>Ce délai permet aux partenaires sociaux de négocier :<br>• Un <strong>accord anticipé<\/strong> : conclu <strong>avant<\/strong> la restructuration pour harmoniser les statuts<br>• Un <strong>accord d'adaptation<\/strong> : négocié <strong>au moment de ou après<\/strong> la mise en cause pour gérer les différences<br>• Un <strong>nouvel accord<\/strong> : définir de nouvelles règles communes\n <\/div>", "choices": ["Non, seuls les avantages de A sont maintenus", "Oui, les dispositions plus favorables survivent pendant 15 mois minimum", "Non, car il travaillait dans A et pas dans B", "Oui, mais seulement si un accord d'adaptation est signé"], "correct": 1, "explanation": "<strong>Oui, le salarié doit percevoir la prime de panier repas.<\/strong><br><br><strong>Analyse juridique :<\/strong><br><strong>Mise en cause des accords :<\/strong><br>• La fusion entraîne la mise en cause automatique des accords d'entreprise<br>• La convention collective nationale est <strong>maintenue<\/strong> (même branche)<br><br><strong>⏱ Période de survie (15 mois) :<\/strong><br>En l'absence d'accord anticipé ou d'adaptation, les dispositions <strong>plus favorables<\/strong> survivent pendant <strong>15 mois minimum<\/strong>.<br><br><strong>Dans notre cas :<\/strong><br>• Le salarié vient de A (absorbée) et rejoint B (absorbante)<br>• L'accord d'entreprise B prévoit une prime de panier repas<br>• Cette prime est <strong>plus favorable<\/strong> que l'absence de prime<br>• Pas d'accord anticipé ou d'adaptation mentionné → Application de la règle des 15 mois<br><br><strong>Que doit faire la société B ?<\/strong><br>Pendant ces 15 mois, B doit :<br>1. Appliquer les dispositions favorables des deux accords<br>2. Négocier un <strong>accord d'adaptation<\/strong> pour harmoniser les statuts<br>3. Définir un nouveau cadre collectif commun<br><br><strong>Le salarié bénéficie donc de la prime de panier repas de l'accord B pendant au moins 15 mois.<\/strong>"}], "CASES": [{"id": 1, "situation": "La crise sanitaire impacte votre entreprise qui a récemment investi dans des machines coûteuses payées comptant. L'entreprise peine à payer les salaires, son découvert augmente, et elle ne paie plus la TVA ni les cotisations URSSAF. Elle envisage de vendre les machines, mais cela prendra du temps.", "details": ["Trésorerie fortement impactée", "Non-paiement des dettes fiscales et sociales", "Découvert bancaire en augmentation constante", "Machines vendables mais recherche d'acquéreur longue"], "choices": ["Il y a cessation des paiements, une procédure collective p   el.addEventListener('pointermove', e => {
    if (!drag || drag.el !== el || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      drag.moved = true;
      const r = el.getBoundingClientRect();
      const g = el.cloneNode(true);
      g.classList.add('drag-ghost'); g.classList.remove('sel');
      g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
      drag.dx = drag.sx - r.left; drag.dy = drag.sy - r.top;
      document.body.appendChild(g); drag.ghost = g;
      el.classList.add('lift');
      autoScroll();
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    $$('.over').forEach(z => z.classList.remove('over'));
    const z = zoneAt(e.clientX, e.clientY);
    if (z && !z.classList.contains('locked')) z.classList.add('over');
  });
  el.addEventListener('pointerup', e => {
    if (!drag || drag.el !== el) return;
    const d = drag;
    const z = d.moved ? zoneAt(e.clientX, e.clientY) : null;
    endDrag();
    if (d.moved) { if (z) d.onDrop(z.dataset.drop); }
    else if (d.onTap) d.onTap();
  });
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('lostpointercapture', () => { if (drag && drag.el === el) setTimeout(() => { if (drag && drag.el === el) endDrag(); }, 0); });
}
function autoScroll() {
  if (!drag || !drag.moved) return;
  const tray = $('.tray');
  const bottomLimit = tray ? tray.getBoundingClientRect().top : window.innerHeight;
  if (drag.y < bottomLimit - 80) drag.leftTray = true;
  if (drag.y < 150) window.scrollBy(0, -9);
  else if (drag.leftTray && drag.y > bottomLimit - 60 && drag.y < bottomLimit + 40) window.scrollBy(0, 9);
  scrollRAF = requestAnimationFrame(autoScroll);
}
document.addEventListener('touchmove', e => { if (drag && drag.moved) e.preventDefault(); }, { passive: false });
['blur', 'pagehide', 'resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, endDrag));
document.addEventListener('visibilitychange', endDrag);

function schemaHTML(q) {
  const v = q.visualExplanation; if (!q.visual || !v) return '';
  const E = (name, label, cls) => `<div class="ent ${cls || ''}"><b>${esc(name)}</b><span>${esc(label)}</span></div>`;
  let inner = '';
  switch (q.visual) {
    case 'modification': inner = `<div class="schema-row">${E(v.before, v.beforeLabel)}<span class="sym">→</span>${E(v.after, v.afterLabel)}</div>`; break;
    case 'fusion-absorption': inner = `<div class="schema-row">${E(v.entityA, 'Absorbante')}<span class="sym">+</span>${E(v.entityB, 'Absorbée', 'gone')}<span class="sym">→</span>${E(v.result, v.resultLabel, 'new')}</div>`; break;
    case 'fusion-creation': inner = `<div class="schema-row">${E(v.entityA, 'Disparaît', 'gone')}<span class="sym">+</span>${E(v.entityB, 'Disparaît', 'gone')}<span class="sym">→</span>${E(v.result, v.resultLabel, 'new')}</div>`; break;
    case 'scission': inner = `<div class="schema-row">${E(v.before, v.beforeLabel, 'gone')}<span class="sym">→</span><div class="schema-col">${v.results.map(x => E(x, 'Nouvelle', 'new')).join('')}</div></div>`; break;
    case 'apport-partiel': inner = `<div class="schema-col">${E(v.before, v.beforeLabel)}<span class="sym">↓</span><div class="schema-row">${E(v.remainingBefore, v.remainingBeforeLabel)}<span class="sym">→</span>${E(v.after, v.afterLabel, 'new')}</div></div>`; break;
    case 'prise-participation': inner = `<div class="schema-col">${E(v.parent, v.parentLabel)}<span class="txt" style="font-size:13px;text-align:center">${esc(v.connection)}</span>${E(v.subsidiary, v.subsidiaryLabel)}</div>`; break;
  }
  return `<div class="schema"><span class="mono sm">Schéma de la restructuration</span>${inner}${v.note ? `<div class="snote">${esc(v.note)}</div>` : ''}</div>`;
}
function gameQuiz(r, Q, pts, isCh1) {
  const q = Q[r.idx];

    else if (i === r.sel) cls += ' sel';
    return `<button class="${cls}" ${r.done ? '' : `data-act="pick" data-arg="${i}"`}><span class="chip">${L[i]}</span><span>${c}</span></button>`;
  }).join('');
  const ok = r.done && r.sel === q.correct;
  const last = r.idx + 1 >= Q.length;
  return `${hud(r, 'Question ' + (r.idx + 1) + '/' + Q.length)}
  <div class="bubble"><div class="lbl">${label}</div><div class="q">${q.question}</div>

  <div class="answers">${answers}</div>
  ${r.done ? `<div class="fb${ok ? '' : ' ko'}"><div class="verdict">${ok ? 'Bonne réponse · +' + pts : 'Incorrect'}</div><div class="txt">${q.explanation}</div></div>` : ''}
  <div class="bar"><div class="bar-in">
    ${r.done ? `<div class="verdict${ok ? '' : ' ko'}">${ok ? 'Juste' : 'Faux'}</div><button class="btn" data-act="nextQ">${last ? 'Voir mon résultat' : 'Question suivante'}</button>`
             : `<button class="btn" data-act="validate" ${r.sel == null ? 'disabled' : ''}>Valider ma réponse</button>`}
  </div></div>`;
}

// ---------- Chapitre 3, partie 1 : associations ----------
function partTabs(r) { return `<div class="part-tabs">${['Associations', 'Frises', 'Cessation des paiements'].map((t, i) => `<span class="${r.part === i + 1 ? 'on' : ''}">${i + 1}. ${t}</span>`).join('')}</div>`; }
function gamePart1(r) {
  const p = r.p1;
  const usedBy = Object.values(p.placed);
  const zones = PROCS.map(def => {
    const proc = p.placed[def];
    let cls = 'zone def';
    if (proc) cls += ' filled';
    if (p.checked) cls += (proc === def ? ' good' : ' bad') + ' locked';
    const act = p.checked ? '' : `data-act="zoneTap" data-arg="${def}"`;
    return `<div class="${cls}" data-drop="${def}" ${act}>
      <div class="zh">${esc(DEFS[def])}</div>
      ${proc ? `<div class="placed">${PROC_LABEL[proc]}</div>` : ''}
      ${p.checked && proc !== def ? `<div class="corr">Bonne réponse : ${PROC_LABEL[def]}</div>` : ''}
    </div>`;
  }).join('');
  const remaining = p.tray.filter(x => !usedBy.includes(x));
  const n = Object.keys(p.placed).length;
  let msg = '', actions = '';
  if (p.checked) {
    const good = PROCS.filter(d => p.placed[d] === d).length;
    msg = `<div class="tray-msg ${good === 4 ? 'ok' : 'ko'}">${good}/4 associations justes · +${good * P1_PTS} points</div>`;
    actions = `<div class="tray-actions"><button class="btn" data-act="toPart2">Partie 2 : les frises</button></div>`;
  } else if (remaining.length) {
    msg = `<div class="tray-msg ok" style="color:rgba(255,255,255,0.8);font-weight:700">Glisse une procédure sur sa définition, ou touche-la puis la définition.</div>`;
    actions = `<div class="cards">${remaining.map(x => `<div class="term${p.sel === x ? ' sel' : ''}" data-term="${x}">${PROC_LABEL[x]}</div>`).join('')}</div>`;
  } else {
    msg = `<div class="tray-msg ok">Tout est placé. Tu peux encore modifier en touchant une définition.</div>`;
    actions = `<div class="tray-actions"><button class="btn" data-act="checkP1">Valider mes associations</button></div>`;
  }
  return { html: `${hud(r, 'Partie 1 · Associations')}${partTabs(r)}
    <div class="board-title" style="font-size:17px">Associe chaque procédure à sa définition</div>
    <div>${zones}</div>`, tray: `<div class="tray"><div class="tray-in">${msg}${actions}</div></div>` };
}

// ---------- Chapitre 3, partie 2 : frises ----------
function gamePart2(r) {
  const p = r.p2, proc = PROCS[p.proc], steps = TIMELINE[proc];
  if (!p.tray) p.tray = shuffle(steps.map((s, i) => i));
  const used = Object.values(p.placed);
  const slots = steps.map((s, pos) => {
    const k = p.placed[pos];
    let cls = 'zone slot';
    if (k != null) cls += ' filled';
    if (p.checked) cls += (k === pos ? ' good' : ' bad') + ' locked';
    const act = p.checked ? '' : `data-act="slotTap" data-arg="${pos}"`;
    return `<div class="${cls}" data-drop="${pos}" ${act}><div class="slot-num">${pos + 1}</div>
      <div style="flex:1">${k != null ? `<div class="zt">${esc(steps[k])}</div>` : `<div class="zh">Étape ${pos + 1}</div>`}
      ${p.checked && k !== pos ? `<div class="corr">Bonne étape : ${esc(steps[pos])}</div>` : ''}</div></div>`;
  }).join('');
  const remaining = p.tray.filter(i => !used.includes(i));
  let msg = '', actions = '';
  const lastProc = p.proc + 1 >= PROCS.length;
  if (p.checked) {
    const ok = steps.every((s, pos) => p.placed[pos] === pos);
    msg = `<div class="tray-msg ${ok ? 'ok' : 'ko'}">${ok ? 'Ordre juste · +' + P2_PTS + ' points' : "L'ordre n'est pas juste : la bonne étape est indiquée sous chaque case."}</div>`;
    actions = `<div class="tray-actions"><button class="btn" data-act="nextProc">${lastProc ? 'Partie 3 : cessation des paiements' : 'Procédure suivante : ' + PROC_LABEL[PROCS[p.proc + 1]]}</button></div>`;
  } else if (remaining.length) {
    msg = `<div class="tray-msg ok" style="color:rgba(255,255,255,0.8);font-weight:700">Glisse chaque étape dans sa case, ou touche-la puis la case.</div>`;
    // Petit écran : 2 étapes à la fois pour laisser voir la frise
    const limit = window.innerHeight < 760 ? 2 : 4;
    let visible = remaining;
    if (remaining.length > limit) {
      const start = (p.rot || 0) % remaining.length;
      visible = remaining.slice(start).concat(remaining.slice(0, start)).slice(0, limit);
      if (p.sel != null && remaining.includes(p.sel) && !visible.includes(p.sel)) visible[limit - 1] = p.sel;
    }
    actions = `<div class="cards">${visible.map(i => `<div class="term long${p.sel === i ? ' sel' : ''}" data-term="${i}">${esc(steps[i])}</div>`).join('')}</div>`
      + (visible.length < remaining.length ? `<div style="text-align:center"><button class="linkbtn" data-act="rotateSteps" style="font-size:13px;padding:2px">Autres étapes (${remaining.length - visible.length})</button></div>` : '');
  } else {
    msg = `<div class="tray-msg ok">Toutes les étapes sont placées. Touche une case pour la vider si besoin.</div>`;
    actions = `<div class="tray-actions"><button class="btn" data-act="checkP2">Valider cet ordre</button></div>`;
  }
  return { html: `${hud(r, 'Partie 2 · ' + PROC_LABEL[proc] + ' (' + (p.proc + 1) + '/4)')}${partTabs(r)}
    <div class="board-title" style="font-size:17px">${PROC_LABEL[proc]} : du début à la fin</div>
    <div>${slots}</div>`, tray: `<div class="tray"><div class="tray-in">${msg}${actions}</div></div>` };
}

// ---------- Chapitre 3, partie 3 : cessation des paiements ----------
function gamePart3(r) {
  const p = r.p3, q = CASES[p.idx];
  const answers = q.choices.map((c, i) => {
    let cls = 'answer';
    if (p.done) { cls += ' done'; if (i === q.correct) cls += ' good'; else if (i === p.sel) cls += ' bad'; }
    return `<button class="${cls}" ${p.done ? '' : `data-act="pickCase" data-arg="${i}"`}><span class="chip">${L[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');
  const ok = p.done && p.sel === q.correct;
  const last = p.idx + 1 >= CASES.length;
  return `${hud(r, 'Partie 3 · Cas ' + (p.idx + 1) + '/' + CASES.length)}${partTabs(r)}
  <div class="bubble"><div class="lbl">Cas pratique ${p.idx + 1}</div><div class="txt" style="margin-top:6px">${esc(q.situation)}</div>
    <ul class="case-details">${q.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>
  <div class="mono" style="text-align:center">Y a-t-il cessation des paiements ?</div>
  <div class="answers">${answers}</div>
  ${p.done ? `<div class="fb${ok ? '' : ' ko'}"><div class="verdict">${ok ? 'Bonne réponse · +' + P3_PTS : 'Incorrect'}</div><div class="txt">${q.explanation}</div></div>
  <div class="bar"><div class="bar-in"><div class="verdict${ok ? '' : ' ko'}">${ok ? 'Juste' : 'Faux'}</div><button class="btn" data-act="nextCase">${last ? 'Voir mon résultat' : 'Cas suivant'}</button></div></div>` : ''}`;
}

// ---------- Résultat ----------
function viewResult(d) {
  const c = d.chapter, best = DB.best[c] || 0, on = best >= CHAPTERS[c].threshold;
  const p = pct(d.score, CHAPTERS[c].max);
  const msg = p >= 85 ? 'Excellent : tu maîtrises ce chapitre.' : p >= 65 ? 'Très bien : les bases sont solides, reprends les quelques points ci-dessous.' : p >= 45 ? 'Correct, mais plusieurs notions restent fragiles : relis les explications et recommence.' : 'Ce chapitre est à reprendre : relis les explications avant de recommencer.';
  return `${LOGO}
  <div class="rise" style="display:flex;flex-direction:column;gap:16px">
    ${kicker('Chapitre ' + c + ' terminé')}
    <div class="panel" style="padding:24px">
      <div class="mono sm">Score de cette partie</div>
      <div class="big" style="margin-top:4px">${fmt(d.score)} points</div>
      <div class="h2" style="font-size:20px;margin-top:4px">${d.correct}/${d.total} bonnes réponses</div>
      <div><span class="pill cy wrap" style="font-size:13px;padding:8px 16px">${p} % des points · maximum ${fmt(CHAPTERS[c].max)}</span></div>
      ${d.score < best ? `<div class="note">Ton meilleur score reste <strong>${fmt(best)} points</strong>.</div>` : ''}
    </div>
    <div class="panel white"><div class="txt" style="font-size:16px">${msg}<br><br>${on ? `Badge obtenu : <strong>${CHAPTERS[c].badge}</strong>` : `Badge ${CHAPTERS[c].badge} : ${fmt(CHAPTERS[c].threshold)} points requis.`}</div></div>
    ${d.misses.length ? `<div class="panel deep" style="gap:10px"><div class="mono">À revoir</div>${d.misses.map(m => `<div class="miss"><div class="mq">${esc(m.q)}</div><div class="ma">${esc(m.good)}</div></div>`).join('')}</div>` : ''}
    ${c < 3 ? `<button class="btn" data-act="openChapter" data-arg="${c + 1}">Chapitre ${c + 1} : ${CHAPTERS[c + 1].title}</button>` : ''}
    <button class="btn ghost" data-act="retry" data-arg="${c}">Recommencer le chapitre</button>
    <button class="btn ghost" data-act="home">Retour à l'accueil</button>
    ${c === 3 ? CONTACT : ''}
  </div>`;
}

// ============================================================
// ACTIONS
// ============================================================
function go(screen, data) { ui = { screen, data: data || null }; if (screen !== 'run') DB.active = null; save(); render(); }
function finish(r) {
  const c = r.chapter;
  DB.done[c] = true;
  if (r.score > (DB.best[c] || 0)) DB.best[c] = r.score;
  delete DB.runs['ch' + c];
  go('result', { chapter: c, score: r.score, correct: r.correct, total: r.total, misses: r.misses });
}
function placeIn(map, key, val) { for (const k in map) if (map[k] === val) delete map[k]; map[key] = val; }

const ACTIONS = {
  home() { go('home'); },
  scores() { go('scores'); },
  openChapter(c) { c = +c; const k = 'ch' + c; if (!DB.runs[k]) DB.runs[k] = newRun(c); DB.active = k; ui = { screen: 'run' }; save(); render(); },
  retry(c) { c = +c; DB.runs['ch' + c] = newRun(c); DB.active = 'ch' + c; ui = { screen: 'run' }; save(); render(); },
  startGame() { const r = cur(); r.view = 'game'; r.started = true; save(); render(); },
  showIntro() { const r = cur(); r.view = 'intro'; save(); render(); },
  caseSeen() { const r = cur(); r.seenCase = true; save(); render(); },
  pick(i) { const r = cur(); if (r.done) return; r.sel = +i; save(); render(); },
  validate() {
    const r = cur(); if (r.done || r.sel == null) return;
    const Q = r.chapter === 1 ? CH1 : CH2, q = Q[r.idx], ok = r.sel === q.correct;
    r.done = true; r.total++;
    if (ok) { r.correct++; r.score += r.chapter === 1 ? 100 : 200; } else miss(r, q.question, q.choices[q.correct]);
    save(); render(); showFeedback();
  },
  nextQ() {
    const r = cur(); if (!r.done) return;
    const Q = r.chapter === 1 ? CH1 : CH2;
    r.idx++; r.sel = null; r.done = false;
    if (r.idx >= Q.length) return finish(r);
    save(); render();
  },
  // partie 1
  zoneTap(def) {
    const p = cur().p1; if (p.checked) return;
    if (p.sel) { placeIn(p.placed, def, p.sel); p.sel = null; }
    else if (p.placed[def]) delete p.placed[def];
    save(); render();
  },
  checkP1() {
    const r = cur(), p = r.p1; if (p.checked || Object.keys(p.placed).length < 4) return;
    p.checked = true;
    PROCS.forEach(d => { r.total++; if (p.placed[d] === d) { r.correct++; r.score += P1_PTS; p.score += P1_PTS; } else miss(r, 'Définition : ' + DEFS[d], PROC_LABEL[d]); });
    save(); render();
  },
  toPart2() { const r = cur(); r.part = 2; save(); render(); },
  // partie 2
  slotTap(pos) {
    const p = cur().p2; if (p.checked) return; pos = +pos;
    if (p.sel != null) { placeIn(p.placed, pos, p.sel); p.sel = null; }
    else if (p.placed[pos] != null) delete p.placed[pos];
    save(); render();
  },
  checkP2() {
    const r = cur(), p = r.p2, steps = TIMELINE[PROCS[p.proc]];
    if (p.checked || Object.keys(p.placed).length < steps.length) return;
    p.checked = true; r.total++;
    const ok = steps.every((s, pos) => p.placed[pos] === pos);
    if (ok) { r.correct++; r.score += P2_PTS; p.score += P2_PTS; } else miss(r, 'Ordre des étapes : ' + PROC_LABEL[PROCS[p.proc]], steps.map((s, i) => (i + 1) + '. ' + s).join(' / '));
    save(); render();
  },
  rotateSteps() { const p = cur().p2; p.rot = (p.rot || 0) + 2; p.sel = null; save(); render(); },
  nextProc() {
    const r = cur(), p = r.p2; if (!p.checked) return;
    if (p.proc + 1 >= PROCS.length) { r.part = 3; save(); render(); return; }
    p.proc++; p.placed = {}; p.sel = null; p.checked = false; p.tray = null; p.rot = 0;
    save(); render();
  },
  // partie 3
  pickCase(i) {
    const r = cur(), p = r.p3; if (p.done) return;
    const q = CASES[p.idx]; p.sel = +i; p.done = true; r.total++;
    if (p.sel === q.correct) { r.correct++; r.score += P3_PTS; p.score += P3_PTS; } else miss(r, 'Cas ' + (p.idx + 1) + ' : ' + q.situation, q.choices[q.correct]);
    save(); render(); showFeedback();
  },
  nextCase() {
    const r = cur(), p = r.p3; if (!p.done) return;
    p.idx++; p.sel = null; p.done = false;
    if (p.idx >= CASES.length) return finish(r);
    save(); render();
  },
  resetAll() {
    if (!confirm('Cette action efface ta progression et tes scores sur cet appareil.\n\nConfirmes-tu ?')) return;
    DB = emptyDB(); save(); go('home');
  }
};
function showFeedback() {
  const fb = $('.fb'), bar = $('.bar'); if (!fb) return;
  const r = fb.getBoundingClientRect();
  const limit = (bar ? bar.getBoundingClientRect().top : window.innerHeight) - 12;
  if (r.top > limit - 80 || r.bottom > limit) window.scrollBy({ top: Math.min(r.top - 90, r.bottom - limit + 40), behavior: 'smooth' });
}

function bindAll() {
  const r = activeRun();
  if (ui.screen !== 'run' || !r || r.view !== 'game' || r.chapter !== 3) return;
  if (r.part === 1) $$('.term').forEach(el => {
    const t = el.dataset.term;
    bindDrag(el, def => { const p = cur().p1; if (p.checked) return; placeIn(p.placed, def, t); p.sel = null; save(); render(); },
      () => { const p = cur().p1; p.sel = p.sel === t ? null : t; save(); render(); });
  });
  if (r.part === 2) $$('.term').forEach(el => {
    const t = +el.dataset.term;
    bindDrag(el, pos => { const p = cur().p2; if (p.checked) return; placeIn(p.placed, +pos, t); p.sel = null; save(); render(); },
      () => { const p = cur().p2; p.sel = p.sel === t ? null : t; save(); render(); });
  });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.hasAttribute('disabled')) return;
  if (el.tagName === 'SUMMARY') return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el.dataset.arg);
});

(function start() {
  if (DB.active && DB.runs[DB.active]) ui = { screen: 'run' }; else ui = { screen: 'home' };
  render();
})();
</script>
</body>
</html>
