:root {
  --cyan: #25CCF6;
  --cyan-hover: #4ad8ff;
  --ink: #024a75;
  --deep: rgba(0,60,105,0.45);
  --glass: rgba(255,255,255,0.12);
  --glass-2: rgba(255,255,255,0.16);
  --line: rgba(255,255,255,0.42);
  --bad-bg: rgba(255,120,120,0.28);
  --bad: #ff9a9a;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { min-height: 100%; background: #0190d0; }
body { min-height: 100vh; min-height: 100dvh; background: transparent; color: #ffffff; font-family: Figtree, Helvetica, Arial, sans-serif; font-weight: 700; text-wrap: pretty; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }

/* Fond : identique au jeu des budgets */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(148deg, #004e88 0%, #006dbf 26%, #0190d0 56%, #16b6ec 82%, #25CCF6 100%); }
.bg::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 92% 84%, rgba(37,204,246,0.45) 0%, rgba(37,204,246,0) 70%); }
.bg::after { content: ""; position: absolute; inset: -4px; background-image: radial-gradient(circle, rgba(255,255,255,0.16) 1.2px, rgba(255,255,255,0) 2px); background-size: 26px 26px; }
.orb { position: fixed; z-index: 0; pointer-events: none; border-radius: 50%; background: #ffffff; box-shadow: 0 0 40px 12px rgba(255,255,255,0.10); }

const STORE_KEY = 'compta_game_v2';
function emptyDB() { return { player:null, results:{ 1:{}, 2:{}, 3:{}, 4:{}, exam:{} }, runs:{}, active:null }; }
function loadDB() {
  let db = null;
  try { const s = localStorage.getItem(STORE_KEY); if (s) db = JSON.parse(s); } catch (e) { db = null; }
  if (!db || typeof db !== 'object') db = migrateOld() || emptyDB();
  const base = emptyDB();
  db.results = Object.assign(base.results, db.results || {});
  db.runs = db.runs || {};
  return db;
}
// Reprise des scores de l'ancienne version (1re tentative déjà gardée par elle)
function migrateOld() {
  try {
    const first = JSON.parse(localStorage.getItem('compta_game_first_answers') || 'null');
    if (!first) return null;
    const db = emptyDB();
    let any = false;
    for (let c = 1; c <= 4; c++) {
      const raw = first[c];
      if (raw && raw.length) {
        // L'ancienne version ajoutait les placements refaits après « Recommencer
        // cette section » : on ne garde que le premier placement de chaque notion,
        // sans jamais dépasser le nombre de questions du chapitre.
        const seen = new Set();
        const a = raw.filter(x => { const k = x.questionText; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, CHAPTERS[c].total);
        const correct = a.filter(x => x.isCorrect).length;
        db.results[c].first = { score: correct * 100, correct, total: CHAPTERS[c].total, answers: a.map(x => ({ q: x.questionText, good: x.correctAnswer, user: x.userAnswer, ok: !!x.isCorrect })), date: null };
        any = true;
      }
    }
    return any ? db : null;
  } catch (e) { return null; }
}

function initCS(ch) {
  const base = { score:0, correct:0, answers:[], scored:{}, fb:null };
  if (ch === 1) return Object.assign(base, { order: shuffle(CH1.map((q, i) => i)), idx:0, pick:null });
  if (ch === 2 || ch === 3) return Object.assign(base, { step:0, placed:{}, sel:null, tray:null });
  return Object.assign(base, { idx:0, sel:null, done:false });
}
function newChapterRun(ch) { return { mode:'chapter', chapter:ch, view:'intro', started:false, cs:initCS(ch) }; }
function newExamRun() { return { mode:'exam', part:0, chapter:1, view:'examIntro', started:false, cs:initCS(1), parts:[] }; }
function runKey(r) { return r.mode === 'exam' ? 'exam' : 'ch' + r.chapter; }
function activeRun() { return DB.active ? DB.runs[DB.active] : null; }
function answeredCount(ch, cs) {
  if (ch === 1) return cs.idx + (cs.pick ? 1 : 0);
  if (ch === 4) return cs.idx + (cs.done ? 1 : 0);
  return Object.keys(cs.scored).length;
}
function stepTerms(ch, cs) { return (ch === 2 ? CH2 : CH3)[cs.step].terms; }
function trayOrder(ch, cs) {
  if (!cs.tray) cs.tray = shuffle(stepTerms(ch, cs).map(t => t.term));
  return cs.tray;
}
function record(cs, q, good, user, ok, key) {
  if (key in cs.scored) return false;          // seul le premier placement compte
  cs.scored[key] = ok;
  if (ok) { cs.score += 100; cs.correct++; }
  cs.answers.push({ q, good, user, ok });
  return true;
}

// ============================================================
// GLISSER-DÉPOSER ROBUSTE (souris, doigt, stylet)
// Corrige le bug iPhone : quand iOS interrompt un glissement
// (geste système, défilement, appel), l'étiquette fantôme
// n'était jamais retirée et restait au milieu de l'écran.
// Ici elle est retirée dans tous les cas, et à chaque affichage.
// ============================================================
let drag = null, scrollRAF = null;
function clearGhosts() {
  $$('.drag-ghost').forEach(g => g.remove());
  $$('.over').forEach(z => z.classList.remove('over'));
  $$('.lift').forEach(z => z.classList.remove('lift'));
  if (scrollRAF) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
}
function endDrag() { drag = null; clearGhosts(); }
function zoneAt(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest('[data-drop]') : null;
}
function bindDrag(el, onDrop, onTap) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    endDrag();
    drag = { el, id: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, moved: false, ghost: null, dx: 0, dy: 0, onDrop, onTap };
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', e => {
    if (!drag || drag.el !== el || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      drag.moved = true;
      const r = el.getBoundingClientRect();
      const g = el.cloneNode(true);
      g.classList.add('drag-ghost'); g.classList.remove('sel');
      g.removeAttribute('id');
      g.style.width = r.width + 'px'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px';
      drag.dx = drag.sx - r.left; drag.dy = drag.sy - r.top;
      document.body.appendChild(g);
      drag.ghost = g;
      el.classList.add('lift');
      autoScroll();
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
    drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
    $$('.over').forEach(z => z.classList.remove('over'));
    const z = zoneAt(e.clientX, e.clientY);
    if (z && !z.classList.contains('good') && !z.classList.contains('bad')) z.classList.add('over');
  });
  el.addEventListener('pointerup', e => {
    if (!drag || drag.el !== el) return;
    const d = drag;
    const z = d.moved ? zoneAt(e.clientX, e.clientY) : null;
    endDrag();
    if (d.moved) { if (z) d.onDrop(z.dataset.drop); }
    else if (d.onTap) d.onTap();
  });
  el.addEventListener('pointercancel', endDrag);
  el.addEventListener('lostpointercapture', () => { if (drag && drag.el === el) setTimeout(() => { if (drag && drag.el === el) endDrag(); }, 0); });
}
function autoScroll() {
  if (!drag || !drag.moved) return;
  const tray = $('.tray');
  const bottomLimit = tray ? tray.getBoundingClientRect().top : window.innerHeight;
  // On ne fait défiler vers le bas qu'une fois l'étiquette sortie du bac,
  // sinon la page défilerait dès qu'on attrape une étiquette.
  if (drag.y < bottomLimit - 80) drag.leftTray = true;
  if (drag.y < 150) window.scrollBy(0, -9);
  else if (drag.leftTray && drag.y > bottomLimit - 60 && drag.y < bottomLimit + 40) window.scrollBy(0, 9);
  scrollRAF = requestAnimationFrame(autoScroll);
}
document.addEventListener('touchmove', e => { if (drag && drag.moved) e.preventDefault(); }, { passive: false });
['blur', 'pagehide', 'resize', 'orientationchange'].forEach(ev => window.addEventListener(ev, endDrag));
document.addEventListener('visibilitychange', endDrag);

let lastKey = '';
function render() {
  endDrag();
  const app = $('#app');
  const trayHost = $('#trayHost');
  let html = '', tray = '';
  if (!DB.player) ui.screen = 'form';
  switch (ui.screen) {
    case 'form': html = viewForm(); break;
    case 'home': html = viewHome(); break;
    case 'scores': html = viewScores(); break;
    case 'run': { const r = activeRun(); if (!r) { ui.screen = 'home'; html = viewHome(); break; } const v = viewRun(r); html = v.html; tray = v.tray || ''; break; }
    case 'chapterResult': html = viewChapterResult(ui.data); break;
    case 'examResult': html = viewExamResult(ui.data); break;
  }
  app.innerHTML = html;
  trayHost.innerHTML = tray;
  app.style.paddingBottom = '';
  const t = $('.tray');
  if (t) app.style.paddingBottom = (t.offsetHeight + 20) + 'px';
  bindAll();
  const r = activeRun();
  const key = ui.screen + '|' + (r && ui.screen === 'run' ? [runKey(r), r.view, r.chapter, r.cs.idx, r.cs.step].join(':') : '');
  if (key !== lastKey) { window.scrollTo(0, 0); lastKey = key; }
}

function hud(r, stepLabel) {
  const ch = r.chapter, cs = r.cs;
  const exam = r.mode === 'exam';
  const answered = answeredCount(ch, cs);
  const total = CHAPTERS[ch].total;
  let score = cs.score, correct = cs.correct, ans = answered, progress = pct(answered, total);
  if (exam) {
    score += r.parts.reduce((s, p) => s + p.score, 0);
    correct += r.parts.reduce((s, p) => s + p.correct, 0);
    ans += r.parts.reduce((s, p) => s + p.total, 0);
    progress = pct(ans, EXAM_TOTAL);
  }
  return `<div class="hud">
    <div class="hud-top">
      <button class="hud-btn" data-act="home">Accueil</button>
      ${exam ? `<div class="mono sm">Examen · partie ${r.part + 1}/4</div>` : `<button class="hud-btn cy" data-act="showIntro">Revoir les explications</button>`}
    </div>
    <div class="hud-scores">
      <div class="hud-score"><div class="mono sm">Score</div><b>${fmt(score)}</b></div>
      <div class="stat-sep" style="height:18px;margin:0"></div>
      <div class="hud-score"><div class="mono sm">Réussite</div><b>${pct(correct, ans)} %</b></div>
    </div>
    <div class="progress"><i style="width:${progress}%"></i></div>
    <div class="step-pill">${stepLabel}</div>
  </div>`;
}

function viewGame(r) {
  const ch = r.chapter;
  if (ch === 1) return { html: gameCh1(r) };
  if (ch === 4) return { html: gameCh4(r) };
  return gameBoard(r);
}

// ---------- Chapitre 1 ----------
function gameCh1(r) {
  const cs = r.cs, exam = r.mode === 'exam';
  const q = CH1[cs.order[cs.idx]];
  const picked = cs.pick;
  const ok = picked && picked === q.correct;
  const zone = k => {
    let cls = 'zone1';
    if (picked) { cls += ' locked'; if (k === q.correct) cls += ' good'; else if (k === picked) cls += ' bad'; }
    return `<div class="${cls}" data-drop="${k}" ${picked ? '' : `data-act="ch1Pick" data-arg="${k}"`}><b>${CH1_ZONES[k].label}</b><span>${CH1_ZONES[k].hint}</span></div>`;
  };
  const last = cs.idx + 1 >= CH1.length;
  return `${hud(r, 'Question ' + (cs.idx + 1) + '/' + CH1.length)}
  <div class="zones">${zone('bilan')}${zone('resultat')}</div>
  ${picked
    ? `<div class="bubble"><div class="lbl">La situation</div><div class="q">${esc(q.question)}</div></div>
       <div class="fb${ok ? '' : ' ko'}"><div class="verdict">${ok ? 'Bonne réponse · +100' : 'Pas tout à fait'}</div>
         <div class="txt">${exam ? (ok ? 'Bien joué.' : 'La bonne réponse était : <strong>' + CH1_ZONES[q.correct].label + '</strong>.') : q.explanation}</div></div>
       <div class="bar"><div class="bar-in"><div class="verdict${ok ? '' : ' ko'}">${ok ? 'Juste' : 'Faux'}</div><button class="btn" data-act="ch1Next">${last ? (exam ? 'Partie suivante' : 'Voir mon résultat') : 'Question suivante'}</button></div></div>`
    : `<div class="drag-card" id="ch1Card"><span class="mono sm">La situation</span>${esc(q.question)}</div>
       <div class="hint">Glisse la situation vers le bon document, ou touche directement le document.</div>`}`;
}

// ---------- Chapitre 4 ----------
function gameCh4(r) {
  const cs = r.cs, exam = r.mode === 'exam';
  const q = CH4[cs.idx];
  const L = ['A','B','C','D'];
  const answers = q.choices.map((c, i) => {
    let cls = 'answer';
    if (cs.done) { cls += ' done'; if (i === q.correct) cls += ' good'; else if (i === cs.sel) cls += ' bad'; }
    else if (i === cs.sel) cls += ' sel';
    return `<button class="${cls}" ${cs.done ? '' : `data-act="ch4Sel" data-arg="${i}"`}><span class="chip">${L[i]}</span><span>${esc(c)}</span></button>`;
  }).join('');
  const ok = cs.done && cs.sel === q.correct;
  const last = cs.idx + 1 >= CH4.length;
  return `${hud(r, 'Question ' + (cs.idx + 1) + '/' + CH4.length)}
  <div class="bubble"><div class="lbl">${esc(q.type)}</div><div class="q">${esc(q.question)}</div>
    ${q.context ? `<div class="note ctx">${esc(q.context)}</div>` : ''}</div>
  <div class="answers">${answers}</div>
  ${cs.done ? `<div class="fb${ok ? '' : ' ko'}"><div class="verdict">${ok ? 'Bonne réponse · +100' : 'Incorrect'}</div>${exam ? '' : `<div class="txt">${esc(q.explanation)}</div>`}</div>` : ''}
  <div class="bar"><div class="bar-in">
    ${cs.done
      ? `<div class="verdict${ok ? '' : ' ko'}">${ok ? 'Juste' : 'Faux'}</div><button class="btn" data-act="ch4Next">${last ? (exam ? 'Voir mon résultat' : 'Voir mon résultat') : 'Question suivante'}</button>`
      : `<button class="btn" data-act="ch4Validate" ${cs.sel == null ? 'disabled' : ''}>Valider ma réponse</button>`}
  </div></div>`;
}

// ---------- Chapitres 2 et 3 : tableaux à compléter ----------
function zoneHTML(ch, cs, zoneId, hint, extraCls, tag) {
  const p = cs.placed[zoneId];
  const target = cs.sel && !p ? ' target' : '';
  if (p) return `<div class="zone ${extraCls} ${p.ok ? 'good' : 'bad'}${p.fresh && !p.ok ? ' shake' : ''}" data-drop="${zoneId}">${tag || ''}<div class="zt">${esc(p.term)}</div><div class="zh">${p.ok ? esc(hint) : 'mal placé · ' + esc(hint)}</div></div>`;
  return `<div class="zone ${extraCls}${target}" data-drop="${zoneId}" data-act="zoneTap" data-arg="${zoneId}">${tag || ''}<div class="zh">${esc(hint)}</div></div>`;
}
function boardHTML(ch, cs) {
  if (ch === 2) {
    const z = (id, cls) => zoneHTML(ch, cs, id, CH2_HINTS[id], cls || '');
    if (cs.step === 0) return `<div class="board-title">Le bilan</div>
      <div class="bilan">
        <div class="col">${z('actif-title', 'headz')}${z('actif-immobilise')}${z('actif-circulant')}</div>
        <div class="col">${z('passif-title', 'headz')}${z('capitaux-propres')}${z('dettes')}</div>
      </div>`;
    return `<div class="board-title">Le compte de résultat</div>
      <div class="sect">${z('produits-title', 'headz first')}</div>
      <div class="sect">${z('charges-title', 'headz first')}</div>
      <div class="sect"><div class="sect-title">Calcul des résultats</div>${z('resultat-exploitation', 'first')}${z('resultat-financier')}${z('resultat-exceptionnel')}${z('resultat-net')}</div>`;
  }
  const sec = CH3[cs.step];
  const isRes = CH3_RESULT_SECTIONS.includes(sec.name);
  return `<div class="board-title">Section ${cs.step + 1} / ${CH3.length}</div>
    <div class="sect"><div class="sect-title">${esc(sec.title)}</div>
    ${sec.terms.map((t, i) => {
      let cls = i === 0 ? 'first' : '';
      let tag = '';
      if (isRes) { const prod = ch3IsProduit(t.term); cls += prod ? ' prod' : ' chg'; tag = `<div class="tag">${prod ? 'Produit' : 'Charge'}</div>`; }
      return zoneHTML(ch, cs, t.zone, t.hint, cls, tag);
    }).join('')}</div>`;
}
function gameBoard(r) {
  const ch = r.chapter, cs = r.cs, exam = r.mode === 'exam';
  const steps = ch === 2 ? CH2 : CH3;
  const terms = stepTerms(ch, cs);
  const used = new Set(Object.values(cs.placed).map(p => p.term));
  const remaining = trayOrder(ch, cs).filter(t => !used.has(t));
  // Petit écran : 4 étiquettes à la fois pour laisser voir les cases
  const limit = window.innerHeight < 620 ? 3 : window.innerHeight < 760 ? 4 : 99;
  let visible = remaining;
  if (remaining.length > limit) {
    const start = (cs.rot || 0) % remaining.length;
    visible = remaining.slice(start).concat(remaining.slice(0, start)).slice(0, limit);
    if (cs.sel && remaining.includes(cs.sel) && !visible.includes(cs.sel)) visible[limit - 1] = cs.sel;
  }
  const finished = remaining.length === 0;
  const lastStep = cs.step + 1 >= steps.length;
  const label = ch === 2 ? `Phase ${cs.step + 1}/2 · ${steps[cs.step].title}` : `Section ${cs.step + 1}/${CH3.length} · ${steps[cs.step].title}`;
  let msg = '';
  if (cs.fb) msg = `<div class="tray-msg ${cs.fb.ok ? 'ok' : 'ko'}">${cs.fb.text}</div>`;
  else if (!finished) msg = `<div class="tray-msg ok" style="color:rgba(255,255,255,0.8);font-weight:700">${remaining.length} à placer · glisse une étiquette, ou touche-la puis sa case</div>`;
  const tray = `<div class="tray"><div class="tray-in">
    ${msg}
    ${finished
      ? `<div class="tray-actions">
           ${exam ? '' : `<button class="btn ghost" data-act="restartStep" style="flex:0 0 auto">Refaire</button>`}
           <button class="btn" data-act="nextStep">${lastStep ? (exam ? 'Partie suivante' : 'Voir mon résultat') : (ch === 2 ? 'Phase suivante' : 'Section suivante')}</button></div>`
      : `<div class="cards">${visible.map(t => `<div class="term${cs.sel === t ? ' sel' : ''}" data-term="${esc(t)}">${esc(t)}</div>`).join('')}</div>
         ${visible.length < remaining.length || !(exam || Object.keys(cs.placed).length === 0) ? `<div style="display:flex;justify-content:center;gap:16px">
           ${visible.length < remaining.length ? `<button class="linkbtn" data-act="rotateCards" style="font-size:13px;padding:2px">Autres étiquettes (${remaining.length - visible.length})</button>` : ''}
           ${exam || Object.keys(cs.placed).length === 0 ? '' : `<button class="linkbtn" data-act="restartStep" style="font-size:13px;padding:2px">Recommencer cette ${ch === 2 ? 'phase' : 'section'}</button>`}
         </div>` : ''}`}
  </div></div>`;
  // Le marqueur "fresh" ne sert qu'à animer une seule fois la case fautive
  const html = `${hud(r, label)}${boardHTML(ch, cs)}`;
  Object.values(cs.placed).forEach(p => { delete p.fresh; });
  return { html, tray };
}

// ---------- Résultats ----------
function grade(ch, res) {
  if (ch === 1) return res.score >= 600 ? "Bravo ! Tu as compris l'essentiel." : "Pas mal ! Recommence pour t'entraîner.";
  if (ch === 2) return res.correct >= 9 ? "Bravo ! Tu maîtrises la structure des documents comptables !" : "Recommence pour mieux mémoriser les emplacements !";
  if (ch === 3) return res.correct >= 20 ? "Incroyable ! Tu maîtrises tous les détails de la comptabilité !" : res.correct >= 14 ? "Bravo ! Avec un peu plus de pratique, tu seras un expert !" : "Recommence pour mieux mémoriser les postes !";
  return res.correct >= 9 ? "Félicitations ! Tu maîtrises tous les concepts fondamentaux !" : res.correct >= 6 ? "Excellent ! Avec un peu plus de pratique, tu seras au top !" : "Recommence pour mieux comprendre ces concepts !";
}
function missesHTML(answers) {
  const m = answers.filter(a => !a.ok);
  if (!m.length) return '';
  return `<div class="panel deep" style="gap:10px"><div class="mono">À revoir</div>
    ${m.map(a => `<div class="miss"><div class="mq">${esc(a.q)}</div><div class="ma">${esc(stripHTML(a.good))}</div></div>`).join('')}</div>`;
}
function viewChapterResult(d) {
  const ch = d.chapter, res = d.result, first = DB.results[ch].first;
  const badgeOn = first && first.score >= CHAPTERS[ch].threshold;
  return `${LOGO}
  <div class="rise" style="display:flex;flex-direction:column;gap:16px">
    ${kicker('Chapitre ' + ch + ' terminé')}
    <div class="panel" style="padding:24px">
      <div class="mono sm">${d.isFirst ? 'Score retenu (1re tentative)' : 'Score de cet essai'}</div>
      <div class="big" style="margin-top:4px">${fmt(res.score)} points</div>
      <div class="h2" style="font-size:20px;margin-top:4px">${res.correct}/${res.total} bonnes réponses</div>
      <div><span class="pill cy wrap" style="font-size:13px;padding:8px 16px">${pct(res.correct, res.total)} % de réussite</span></div>
      ${d.isFirst ? '' : `<div class="note">Ton score retenu reste celui de ta 1re tentative : <strong>${fmt(first.score)} points</strong>. Cet essai sert d'entraînement.</div>`}
    </div>
    <div class="panel white"><div class="txt" style="font-size:16px">${grade(ch, res)}${badgeOn ? `<br><br>Badge obtenu : <strong>${CHAPTERS[ch].badge}</strong>` : `<br><br>Badge ${CHAPTERS[ch].badge} : ${fmt(CHAPTERS[ch].threshold)} points requis à la 1re tentative.`}</div></div>
    ${missesHTML(res.answers)}
    ${ch < 4 ? `<button class="btn" data-act="openChapter" data-arg="${ch + 1}">Chapitre ${ch + 1} : ${CHAPTERS[ch + 1].title}</button>`
             : `<button class="btn" data-act="openExam">Passer l'examen final</button>`}
    <button class="btn ghost" data-act="retryChapter" data-arg="${ch}">Recommencer (entraînement)</button>
    <button class="btn ghost" data-act="home">Retour à l'accueil</button>
  </div>`;
}
function viewExamResult(d) {
  const res = d.result, p = pct(res.correct, res.total);
  const first = DB.results.exam.first;
  const title = p >= 90 ? 'Comptabilité maîtrisée' : p >= 70 ? 'Bonnes connaissances' : p >= 50 ? 'Quelques points à revoir' : 'Les bases sont à réviser';
  const msg = p >= 90 ? "Excellent. Bilan, compte de résultat, postes détaillés et ajustements : tout est maîtrisé."
    : p >= 70 ? "Très bien. Les bases sont solides : reprends les quelques points à revoir ci-dessous."
    : p >= 50 ? "Correct, mais plusieurs notions restent fragiles. Revois les chapitres concernés avant de repasser l'examen."
    : "Beaucoup d'erreurs. Reprends les chapitres un par un, avec leurs explications, avant de repasser l'examen.";
  return `${LOGO}

function go(screen, data) { ui = { screen, data: data || null }; if (screen !== 'run') DB.active = null; save(); render(); }
function cur() { return activeRun(); }

function finishChapter(r) {
  const ch = r.chapter, cs = r.cs;
  const result = { score: cs.score, correct: cs.correct, total: CHAPTERS[ch].total, answers: cs.answers, date: new Date().toISOString() };
  if (r.mode === 'exam') {
    r.parts.push({ chapter: ch, score: cs.score, correct: cs.correct, total: CHAPTERS[ch].total, answers: cs.answers });
    r.part++;
    if (r.part >= 4) return finishExam(r);
    r.chapter = r.part + 1; r.cs = initCS(r.chapter); r.view = 'transition';
    save(); render(); return;
  }
  const slot = DB.results[ch];
  const isFirst = !slot.first;
  if (isFirst) slot.first = result;
  slot.last = result;
  slot.attempts = (slot.attempts || 0) + 1;
  delete DB.runs['ch' + ch];
  DB.active = null;
  go('chapterResult', { chapter: ch, result, isFirst });
}
function finishExam(r) {
  const parts = r.parts;
  const result = {
    score: parts.reduce((s, p) => s + p.score, 0), correct: parts.reduce((s, p) => s + p.correct, 0), total: EXAM_TOTAL,
    parts: parts.map(p => ({ chapter: p.chapter, score: p.score, correct: p.correct, total: p.total })),
    answers: parts.reduce((a, p) => a.concat(p.answers), []), date: new Date().toISOString()
  };
  const slot = DB.results.exam;
  const isFirst = !slot.first;
  if (isFirst) slot.first = result;
  slot.last = result;
  slot.attempts = (slot.attempts || 0) + 1;
  delete DB.runs.exam;
  DB.active = null;
  go('examResult', { result, isFirst });
}

const ACTIONS = {
  savePlayer() {
    const fn = $('#fFirst').value.trim(), ln = $('#fLast').value.trim();
    if (!fn || !ln) { alert('Merci de renseigner au minimum ton prénom et ton nom.'); return; }
    DB.player = { firstName: fn, lastName: ln, org: $('#fOrg').value.trim(), level: $('#fLevel').value.trim() };
    go('home');
  },
  home() { go('home'); },
  scores() { go('scores'); },
  openChapter(c) {
    c = +c;
    const key = 'ch' + c;
    if (!DB.runs[key]) DB.runs[key] = newChapterRun(c);
    DB.active = key;
    ui = { screen: 'run' }; save(); render();
  },
  retryChapter(c) { c = +c; DB.runs['ch' + c] = newChapterRun(c); DB.active = 'ch' + c; ui = { screen: 'run' }; save(); render(); },
  openExam() {
    if (!DB.runs.exam) DB.runs.exam = newExamRun();
    DB.active = 'exam'; ui = { screen: 'run' }; save(); render();
  },
  retryExam() { DB.runs.exam = newExamRun(); DB.active = 'exam'; ui = { screen: 'run' }; save(); render(); },
  examBegin() { const r = cur(); r.view = 'transition'; save(); render(); },
  examPart() { const r = cur(); r.view = 'game'; r.started = true; save(); render(); },
  startGame() { const r = cur(); r.view = 'game'; r.started = true; save(); render(); },
  showIntro() { const r = cur(); if (r.mode === 'exam') return; r.view = 'intro'; save(); render(); },

  ch1Pick(zone) {
    const r = cur(), cs = r.cs;
    if (cs.pick) return;
    const q = CH1[cs.order[cs.idx]];
    cs.pick = zone;
    const ok = zone === q.correct;
    record(cs, q.question, CH1_ZONES[q.correct].label + ' (' + CH1_ZONES[q.correct].hint.toLowerCase() + ')', CH1_ZONES[zone].label, ok, 'q' + cs.order[cs.idx]);
    save(); render(); showFeedback();
  },
  ch1Next() {
    const r = cur(), cs = r.cs;
    if (!cs.pick) return;
    cs.idx++; cs.pick = null;
    if (cs.idx >= CH1.length) return finishChapter(r);
    save(); render();
  },
  ch4Sel(i) { const cs = cur().cs; if (cs.done) return; cs.sel = +i; save(); render(); },
  ch4Validate() {
    const r = cur(), cs = r.cs;
    if (cs.done || cs.sel == null) return;
    const q = CH4[cs.idx];
    cs.done = true;
    record(cs, q.question, q.choices[q.correct], q.choices[cs.sel], cs.sel === q.correct, 'q' + cs.idx);
    save(); render(); showFeedback();
  },
  ch4Next() {
    const r = cur(), cs = r.cs;
    if (!cs.done) return;
    cs.idx++; cs.sel = null; cs.done = false;
    if (cs.idx >= CH4.length) return finishChapter(r);
    save(); render();
  },
  zoneTap(zoneId) { const cs = cur().cs; if (cs.sel) placeTerm(cs.sel, zoneId); },
  nextStep() {
    const r = cur(), cs = r.cs;
    const steps = r.chapter === 2 ? CH2 : CH3;
    cs.step++; cs.placed = {}; cs.sel = null; cs.tray = null; cs.fb = null; cs.rot = 0;
    if (cs.step >= steps.length) return finishChapter(r);
    save(); render();
  },
  rotateCards() { const cs = cur().cs; cs.rot = (cs.rot || 0) + (window.innerHeight < 620 ? 3 : 4); cs.sel = null; save(); render(); },
  restartStep() {
    const cs = cur().cs;
    cs.placed = {}; cs.sel = null; cs.tray = null;
    cs.fb = { ok: true, text: 'Section remise à zéro. Les points déjà comptés restent ceux de ton premier placement.' };
    save(); render();
  },
  changePlayer() {
    if (!confirm('Changer de joueur ?\n\nLes scores et les parties en cours enregistrés sur cet appareil seront effacés pour laisser la place au nouveau joueur.')) return;
    DB = emptyDB(); save(); ui = { screen: 'form' }; render();
  },
  resetAll() {
    if (!confirm('Cette action efface toute ta progression et tous tes scores, y compris tes premiers scores retenus.\n\nConfirmes-tu ?')) return;
    const p = DB.player; DB = emptyDB(); DB.player = p; save(); go('home');
  },
  exportPDF() { exportPDF(); },
  sendMail() { sendByEmail(); }
};

// Fait apparaître l'explication au-dessus de la barre du bas
function showFeedback() {
  const fb = $('.fb'), bar = $('.bar');
  if (!fb) return;
  const r = fb.getBoundingClientRect();
  const limit = (bar ? bar.getBoundingClientRect().top : window.innerHeight) - 12;
  if (r.bottom > limit) window.scrollBy({ top: Math.min(r.bottom - limit, r.top - 12), behavior: 'smooth' });
}

function placeTerm(term, zoneId) {
  const r = cur(); if (!r) return;
  const ch = r.chapter, cs = r.cs;
  if (ch !== 2 && ch !== 3) return;
  if (cs.placed[zoneId]) return;
  const terms = stepTerms(ch, cs);
  const tObj = terms.find(t => t.term === term);
  const zoneExists = ch === 2 ? terms.some(t => t.zone === zoneId) : terms.some(t => t.zone === zoneId);
  if (!tObj || !zoneExists) return;
  if (Object.values(cs.placed).some(p => p.term === term)) return;
  const ok = tObj.zone === zoneId;
  cs.placed[zoneId] = { term, ok, fresh: true };
  cs.sel = null;
  const hintOf = z => ch === 2 ? CH2_HINTS[z] : (terms.find(t => t.zone === z) || {}).hint;
  const counted = record(cs, 'Placer « ' + term + ' »', 'Sa case : ' + hintOf(tObj.zone), 'Case choisie : ' + hintOf(zoneId), ok, 's' + cs.step + ':' + term);
  const exam = r.mode === 'exam';
  if (ok) cs.fb = { ok: true, text: '« ' + esc(term) + ' » est bien placé.' + (counted ? ' +100 points' : '') };
  else cs.fb = { ok: false, text: '« ' + esc(term) + ' » n\'était pas au bon endroit.' + (exam ? '' : ' Sa case : ' + esc(hintOf(tObj.zone)) + '.') };
  save(); render();
}

function bindAll() {
  const r = activeRun();
  if (ui.screen !== 'run' || !r || r.view !== 'game') return;
  if (r.chapter === 1) {
    const card = $('#ch1Card');
    if (card) bindDrag(card, zone => ACTIONS.ch1Pick(zone), null);
  }
  if (r.chapter === 2 || r.chapter === 3) {
    $$('.term').forEach(el => {
      const term = el.dataset.term;
      bindDrag(el, zone => placeTerm(term, zone), () => {
        const cs = r.cs; cs.sel = cs.sel === term ? null : term; cs.fb = null; save(); render();
      });
    });
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.hasAttribute('disabled')) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el.dataset.arg);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && ui.screen === 'form' && e.target.tagName === 'INPUT') ACTIONS.savePlayer(); });

function asciiPDF(s) { return stripHTML(String(s)).replace(/[«»]/g, '"').replace(/[’]/g, "'").replace(/[–—]/g, '-').replace(/÷/g, '/').replace(/×/g, 'x').replace(/€/g, ' EUR').replace(/ /g, ' '); }
function exportPDF() {
  if (!window.jspdf) { alert("Le module PDF n'est pas chargé : vérifie ta connexion internet puis réessaie."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 15, CW = W - 2 * M;
  const BLUE = [1,144,208], DARK = [0,78,136], CYAN = [37,204,246], GREEN = [0,134,200], RED = [198,40,40], GREY = [110,110,110];
  let y = M;
  const fill = (x, yy, w, h, c) => { doc.setFillColor(c[0], c[1], c[2]); doc.rect(x, yy, w, h, 'F'); };
  const need = h => { if (y + h > H - 16) { doc.addPage(); y = M; } };
  const p = DB.player || {};
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });

  fill(0, 0, W, 40, BLUE);
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(22);
  doc.text('Hiiato - Compta Game', M, 17);
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text('Rapport de performance individuel', M, 26);
  doc.setFontSize(9); doc.text(dateStr + ' a ' + now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }), W - M, 26, { align:'right' });
  y = 50;

  doc.setDrawColor(BLUE[0], BLUE[1], BLUE[2]); doc.setFillColor(232,248,253); doc.rect(M, y, CW, 30, 'FD');
  doc.setTextColor(DARK[0], DARK[1], DARK[2]); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Joueur', M + 4, y + 8);
  doc.setFontSize(10); doc.setTextColor(40,40,40);
  const line = (lbl, val, yy) => { doc.setFont('helvetica','bold'); doc.text(lbl, M + 4, yy); doc.setFont('helvetica','normal'); doc.text(asciiPDF(val), M + 40, yy); };
  line('Nom et prenom :', (p.firstName || '') + ' ' + (p.lastName || ''), y + 15);
  if (p.org) line('Etablissement :', p.org, y + 21);
  if (p.level) line('Niveau :', p.level, y + 27);
  y += 38;

  doc.setTextColor(DARK[0], DARK[1], DARK[2]); doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Scores retenus (1re tentative)', M, y); y += 5;
  fill(M, y, CW, 8, BLUE);
  doc.setTextColor(255,255,255); doc.setFontSize(8.5);
  const c2 = M + CW * 0.55, c3 = M + CW * 0.78;
  doc.text('Chapitre', M + 2, y + 5.5); doc.text('Score retenu', c2, y + 5.5); doc.text('Bonnes reponses', c3, y + 5.5);
  y += 8;
  for (let c = 1; c <= 4; c++) {
    const f = DB.results[c].first;
    fill(M, y, CW, 7, c % 2 ? [255,255,255] : [240,251,255]);
    doc.setTextColor(40,40,40); doc.setFont('helvetica','normal');
    doc.text('Chapitre ' + c + ' - ' + asciiPDF(CHAPTERS[c].title), M + 2, y + 5);
    doc.setFont('helvetica','bold');
    doc.text(f ? f.score + ' pts' : 'non joue', c2, y + 5);
    doc.text(f ? f.correct + '/' + f.total : '-', c3, y + 5);
    y += 7;
  }
  const e = DB.results.exam.first;
  fill(M, y, CW, 7, [232,248,253]);
  doc.setTextColor(40,40,40); doc.setFont('helvetica','normal'); doc.text('Examen final (4 chapitres)', M + 2, y + 5);
  doc.setFont('helvetica','bold'); doc.text(e ? e.score + ' pts' : 'non passe', c2, y + 5); doc.text(e ? e.correct + '/' + e.total + ' (' + pct(e.correct, e.total) + ' %)' : '-', c3, y + 5);
  y += 7;
  fill(M, y, CW, 8, DARK);
  doc.setTextColor(255,255,255); doc.text('TOTAL DES CHAPITRES', M + 2, y + 5.5); doc.text(firstTotal() + ' pts', c2, y + 5.5);
  y += 14;

  doc.setTextColor(DARK[0], DARK[1], DARK[2]); doc.setFontSize(11); doc.text('Badges', M, y); y += 4;
  const bw = (CW - 4) / 2;
  [1,2,3,4].forEach((c, i) => {
    const f = DB.results[c].first, on = f && f.score >= CHAPTERS[c].threshold;
    const bx = M + (i % 2) * (bw + 4);
    if (i % 2 === 0 && i > 0) y += 13;
    doc.setDrawColor(on ? CYAN[0] : 200, on ? CYAN[1] : 200, on ? CYAN[2] : 200);
    doc.setFillColor(on ? 232 : 245, on ? 248 : 245, on ? 253 : 245); doc.rect(bx, y, bw, 11, 'FD');
    doc.setFontSize(8.5); doc.setFont('helvetica','bold'); doc.setTextColor(on ? DARK[0] : 140, on ? DARK[1] : 140, on ? DARK[2] : 140);
    doc.text(CHAPTERS[c].badge, bx + 3, y + 4.5);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(80,80,80);
    doc.text(on ? 'Obtenu - ' + f.score + ' pts' : 'Requis : ' + CHAPTERS[c].threshold + ' pts', bx + 3, y + 9);
  });
  y += 19;

  const blocks = [];
  for (let c = 1; c <= 4; c++) if (DB.results[c].first) blocks.push({ title: 'Chapitre ' + c + ' - ' + CHAPTERS[c].title + ' (1re tentative)', res: DB.results[c].first });
  if (e) blocks.push({ title: 'Examen final (1er examen)', res: e });
  if (!blocks.length) {
    need(16); doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(GREY[0], GREY[1], GREY[2]);
    doc.text('Aucun chapitre termine pour le moment.', M, y + 6); y += 14;
  }
  blocks.forEach(b => {
    need(22);
    fill(0, y, W, 13, BLUE);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(asciiPDF(b.title), M, y + 6);
    doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text(b.res.correct + '/' + b.res.total + ' bonnes reponses (' + pct(b.res.correct, b.res.total) + ' %) - ' + b.res.score + ' pts', M, y + 11);
    y += 17;
    b.res.answers.forEach((a, i) => {
      doc.setFontSize(8.5);
      const ql = doc.splitTextToSize((i + 1) + '. ' + asciiPDF(a.q), CW - 8);
      const ul = doc.splitTextToSize((a.ok ? 'Juste - ' : 'Faux - ') + 'Reponse donnee : ' + asciiPDF(a.user), CW - 12);
      const gl = a.ok ? [] : doc.splitTextToSize('Bonne reponse : ' + asciiPDF(a.good), CW - 12);
      const h = ql.length * 4 + (ul.length + gl.length) * 3.6 + 6;
      need(h + 2);
      doc.setFillColor(a.ok ? 237 : 255, a.ok ? 248 : 238, a.ok ? 253 : 238);
      doc.setDrawColor(a.ok ? 170 : 239, a.ok ? 222 : 170, a.ok ? 240 : 170);
      doc.rect(M, y, CW, h, 'FD');
      doc.setTextColor(30,30,30); doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      ql.forEach((l, k) => doc.text(l, M + 4, y + 5 + k * 4));
      let iy = y + 5 + ql.length * 4 + 0.5;
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      const col = a.ok ? GREEN : RED; doc.setTextColor(col[0], col[1], col[2]);
      ul.forEach((l, k) => doc.text(l, M + 6, iy + k * 3.6)); iy += ul.length * 3.6;
      doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
      gl.forEach((l, k) => doc.text(l, M + 6, iy + k * 3.6));
      y += h + 2;
    });
    y += 5;
  });

  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); fill(0, H - 10, W, 10, BLUE);
    doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
    doc.text('Hiiato - Compta Game  |  ' + asciiPDF((p.firstName || '') + ' ' + (p.lastName || '')) + '  |  ' + dateStr + '  |  Page ' + i + '/' + n, W / 2, H - 3.8, { align:'center' });
  }
  const safe = asciiPDF(p.lastName || 'joueur').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_');
  doc.save('rapport_compta_game_' + safe + '.pdf');
}

  body += 'JOUEUR\n';
  body += 'Nom et prénom : ' + p.firstName + ' ' + p.lastName + '\n';
  if (p.org) body += 'Établissement : ' + p.org + '\n';
  if (p.level) body += 'Niveau : ' + p.level + '\n';
  body += '\nSCORES RETENUS (1re tentative), Compta Game Hiiato, ' + dateStr + '\n';
  for (let c = 1; c <= 4; c++) {
    const f = DB.results[c].first;
    body += 'Chapitre ' + c + ' (' + CHAPTERS[c].title + ') : ' + (f ? f.score + ' points, ' + f.correct + '/' + f.total : 'non joué') + '\n';
  }
  const e = DB.results.exam.first;
  body += 'Examen final : ' + (e ? e.correct + '/' + e.total + ' (' + pct(e.correct, e.total) + ' %)' : 'non passé') + '\n';
  body += '\nTOTAL DES CHAPITRES : ' + firstTotal() + ' points\n\n';
  const blocks = [];
  for (let c = 1; c <= 4; c++) if (DB.results[c].first) blocks.push(['Chapitre ' + c + ' (' + CHAPTERS[c].title + ')', DB.results[c].first]);
  if (e) blocks.push(['Examen final', e]);
  if (blocks.length) body += 'ERREURS DE LA 1re TENTATIVE\n\n';
  blocks.forEach(([t, res]) => {
    const m = res.answers.filter(a => !a.ok);
    body += t + ' : ' + res.correct + '/' + res.total + '\n';
    if (!m.length) body += '  Aucune erreur.\n';
    m.forEach(a => { body += '  - ' + stripHTML(a.q) + '\n    Réponse donnée : ' + stripHTML(a.user) + '\n    Bonne réponse : ' + stripHTML(a.good) + '\n'; });
    body += '\n';
  });
  body += 'Bonne journée !';
  const subject = '[Compta Game] Résultats de ' + p.firstName + ' ' + p.lastName + ' (' + dateStr + ')';
  window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

// ============================================================
// DÉMARRAGE : on revient là où le joueur s'était arrêté
// ============================================================
(function start() {
  if (!DB.player) ui = { screen: 'form' };
  else if (DB.active && DB.runs[DB.active]) ui = { screen: 'run' };
  else ui = { screen: 'home' };
  render();
})();
</script>
</body>
