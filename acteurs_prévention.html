  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

var(--c-muted);margin-top:2px;\">{{ fb.family }}<\u002Fspan><\u002Fspan>\n                  <span style=\"flex:0 0 auto;font-size:12.5px;font-weight:600;white-space:nowrap;{{ fb.actionCss }}\">{{ fb.action }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button onclick=\"{{ nextCase }}\" disabled=\"{{ nextBlocked }}\" style=\"width:100%;min-height:54px;border-radius:14px;border:none;background:var(--c-blue);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,color .2s;{{ nextCss }}\">{{ nextLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== RECAP ===== -->\n    <sc-if value=\"{{ isRecap }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Récapitulatif\" style=\"flex:1;display:flex;flex-direction:column;min-height:0;\">\n        <div style=\"flex:1;overflow-y:auto;padding:32px 24px 24px;\">\n          <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-blue);font-weight:600;margin-bottom:10px;\">Parcours terminé<\u002Fdiv>\n          <h1 style=\"margin:0;font-size:27px;line-height:1.18;font-weight:700;color:var(--c-text);\">Vous avez mobilisé<br><span style=\"color:var(--c-blue);\">{{ mobCount }} {{ mobWord }} sur {{ actorTotal }}<\u002Fspan><\u002Fh1>\n          <p style=\"margin:13px 0 22px;font-size:15px;line-height:1.55;color:var(--c-muted);\">En bleu, les acteurs correctement identifiés. Touchez une fiche pour la revoir.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;\">\n            <sc-for list=\"{{ recapActors }}\" as=\"ra\" hint-placeholder-count=\"13\">\n              <button onclick=\"{{ ra.onOpen }}\" style=\"border:none;cursor:pointer;font-family:inherit;padding:13px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:100px;{{ ra.css }}\">\n                <image-slot id=\"av-{{ ra.id }}\" src=\"{{ ra.src }}\" shape=\"circle\" placeholder=\"\" style=\"flex:0 0 auto;display:block;width:46px;height:46px;{{ ra.slotCss }}\"><\u002Fimage-slot>\n                <span style=\"font-size:12px;line-height:1.2;font-weight:600;text-align:center;\">{{ ra.name }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:34px;\">\n            <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-blue);font-weight:600;margin-bottom:9px;\">Mémo<\u002Fdiv>\n            <h2 style=\"margin:0;font-size:21px;line-height:1.2;font-weight:700;color:var(--c-text);\">Qui fait quoi, en un mot<\u002Fh2>\n            <p style=\"margin:11px 0 20px;font-size:14.5px;line-height:1.5;color:var(--c-muted);\">Les acteurs internes agissent depuis l'entreprise ; les intervenants externes, eux, viennent du dehors.<\u002Fp>\n\n            <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 11px;\">\n              <span style=\"flex:0 0 auto;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c-blue);background:rgba(0,149,208,.1);padding:5px 11px;border-radius:99px;\">Acteurs internes<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:var(--c-line);\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:24px;\">\n              <sc-for list=\"{{ memoInternes }}\" as=\"m\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ m.onOpen }}\" style=\"width:100%;text-align:left;display:flex;gap:12px;padding:13px 14px;border-radius:14px;background:var(--c-card);border:1.5px solid var(--c-line);cursor:pointer;font-family:inherit;{{ m.css }}\">\n                  <span style=\"flex:0 0 auto;width:3px;border-radius:99px;background:var(--c-blue);\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0;\">\n                    <span style=\"display:block;font-size:14.5px;font-weight:700;line-height:1.3;color:var(--c-text);\">{{ m.name }}<\u002Fspan>\n                    <span style=\"display:block;font-size:13.5px;line-height:1.45;color:var(--c-muted);margin-top:3px;\">→ {{ m.memo }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 11px;\">\n              <span style=\"flex:0 0 auto;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--c-ink);background:rgba(10,23,34,.07);padding:5px 11px;border-radius:99px;\">Intervenants externes<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:var(--c-line);\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:4px;\">\n              <sc-for list=\"{{ memoExternes }}\" as=\"m\" hint-placeholder-count=\"7\">\n                <button onclick=\"{{ m.onOpen }}\" style=\"width:100%;text-align:left;display:flex;gap:12px;padding:13px 14px;border-radius:14px;background:var(--c-card);border:1.5px solid var(--c-line);cursor:pointer;font-family:inherit;{{ m.css }}\">\n                  <span style=\"flex:0 0 auto;width:3px;border-radius:99px;background:var(--c-ink);\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0;\">\n                    <span style=\"display:block;font-size:14.5px;font-weight:700;line-height:1.3;color:var(--c-text);\">{{ m.name }}<\u002Fspan>\n                    <span style=\"display:block;font-size:13.5px;line-height:1.45;color:var(--c-muted);margin-top:3px;\">→ {{ m.memo }}<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:0 0 auto;padding:16px;background:var(--c-card);border-top:1px solid var(--c-line);display:flex;flex-direction:column;gap:10px;\">\n          <button onclick=\"{{ goCases }}\" style=\"width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--c-blue);background:var(--c-card);color:var(--c-blue);font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;\">Rejouer<\u002Fbutton>\n          <button onclick=\"{{ goHome }}\" style=\"width:100%;min-height:52px;border-radius:14px;border:none;background:var(--c-ink);color:#fff;font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer;\">Retour à l'accueil<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===== FICHE ACTEUR ===== -->\n    <sc-if value=\"{{ ficheOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div onclick=\"{{ closeFiche }}\" style=\"position:absolute;inset:0;z-index:60;background:rgba(7,17,25,.55);display:flex;align-items:flex-end;animation:overlayIn .2s ease;\">\n        <div onclick=\"{{ stop }}\" style=\"background:var(--c-card);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:popIn .3s cubic-bezier(.2,.8,.2,1);\">\n          <div style=\"padding:10px 0 0;display:flex;justify-content:center;\"><div style=\"width:42px;height:5px;border-radius:99px;background:var(--c-line);\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"padding:14px 24px 0;display:flex;align-items:center;gap:15px;\">\n            <image-slot id=\"av-{{ ficheId }}\" src=\"{{ ficheSrc }}\" shape=\"circle\" placeholder=\"Photo\" style=\"flex:0 0 auto;display:block;width:64px;height:64px;\"><\u002Fimage-slot>\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--c-muted);font-weight:700;\">{{ ficheFamily }}<\u002Fdiv>\n              <h2 style=\"margin:5px 0 0;font-size:22px;font-weight:700;color:var(--c-blue);line-height:1.14;\">{{ ficheName }}<\u002Fh2>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;\">\n            <div style=\"border-left:3px solid var(--c-blue);padding-left:15px;\">\n              <div style=\"font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c-blue);margin-bottom:5px;\">Qui<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.5;color:var(--c-text);\">{{ ficheWho }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left:3px solid var(--c-blue);padding-left:15px;\">\n              <div style=\"font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c-blue);margin-bottom:5px;\">Pouvoir ou levier<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.5;color:var(--c-text);\">{{ ficheLever }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-left:3px solid var(--c-muted);padding-left:15px;\">\n              <div style=\"font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--c-muted);margin-bottom:5px;\">Ce qu'il ne fait pas<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.5;color:var(--c-text);\">{{ ficheNot }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:14px 24px 24px;border-top:1px solid var(--c-line);\">\n            <button onclick=\"{{ closeFiche }}\" style=\"width:100%;min-height:54px;border-radius:14px;border:none;background:var(--c-blue);color:#fff;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;\">Continuer<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:940}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"home\",   // home | cases | recap\n    caseIndex: 0,\n    step: 0,          // 0 = premiere decision, 1 = apres le blocage\n    answers: {},\n    read: {},         // fiches acteurs deja ouvertes, etape par etape\n    openActorId: null\n  };\n\n  FAMILY = {\n    salarie: \"Terrain\", encadrant: \"Terrain\",\n    employeur: \"Pilotage interne\", cse: \"Pilotage interne\", sdc: \"Pilotage interne\", preventeur: \"Pilotage interne\",\n    medecin: \"Santé au travail\",\n    inspecteur: \"Contrôle et accompagnement externes\", carsat: \"Contrôle et accompagnement externes\",\n    orgtech: \"Contrôle et accompagnement externes\", inrs: \"Contrôle et accompagnement externes\", experts: \"Contrôle et accompagnement externes\",\n    prudhommes: \"Recours juridictionnel\"\n  };\n\n  // 13 fiches acteurs : contenu fourni, repris fidelement.\n  ACTORS = {\n    salarie: { name: \"Salarié\",\n      who: `Chaque travailleur de l'entreprise.`,\n      lever: `Soumis au principe de prudence (article L. 4122-1) : « Conformément aux instructions qui lui sont données par l'employeur, dans les conditions prévues au règlement intérieur pour les entreprises tenues d'en élaborer un, il incombe à chaque travailleur de prendre soin, en fonction de sa formation et selon ses possibilités, de sa santé et de sa sécurité ainsi que de celles des autres personnes concernées par ses actes ou ses omissions au travail. » Il est le premier concerné par les conditions de travail, donc souvent le premier mobilisé, et constitue l'échelon de terrain incontournable : sans sa remontée d'information, la prévention reste théorique.`,\n      not: `Le principe de prudence ne transfère pas la responsabilité de l'employeur sur le salarié ; il s'agit d'une obligation complémentaire, pas d'un déplacement de charge.` },\n    encadrant: { name: \"Encadrant\",\n      who: `Le management de proximité ou intermédiaire.`,\n      lever: `Double rôle. D'une part, moteur de la prévention : il doit incarner l'exemplarité en matière de sécurité et impulser les politiques de prévention au sein de son équipe, tout en assurant la sécurité des salariés qu'il encadre. D'autre part, il est lui-même bénéficiaire de la politique de prévention, notamment en matière de RPS, ce qui explique l'importance accordée à sa propre formation (un encadrant non formé, ni sensibilisé, ni protégé ne peut pas porter la prévention auprès de son équipe).`,\n      not: `Il n'a pas le pouvoir de décision final de l'employeur (sauf délégation de pouvoir formalisée), mais reste l'interface quotidienne entre la politique de prévention et le terrain.` },\n    employeur: { name: \"Employeur\",\n      who: `Le détenteur du pouvoir de direction dans l'entreprise.`,\n      lever: `Il décide. Et parce qu'il décide, la responsabilité juridique de la santé et de la sécurité des salariés lui incombe en premier lieu : il est le premier concerné par les obligations SSCT du Code du travail. Toute la chaîne de prévention part de lui.`,\n      not: `Il ne peut pas se défausser de cette responsabilité sur un tiers (préventeur, salarié désigné compétent) : ces acteurs l'assistent, ils ne le substituent pas.` },\n    cse: { name: \"CSE / CSSCT\",\n      who: `L'instance représentative du personnel et sa commission spécialisée en santé, sécurité et conditions de travail.`,\n      lever: `Pas de pouvoir de décision direct, mais des attributions qui permettent de promouvoir la SSCT : droit d'alerte, inspections, enquêtes, consultations obligatoires, recours à l'expertise. Sa vraie force est sa capacité à mobiliser les autres acteurs (inspecteur du travail, CARSAT, médecin du travail) : c'est un acteur-levier plus qu'un acteur-décideur.`,\n      not: `Il ne se substitue pas à l'employeur dans la décision, et la CSSCT ne dispose pas de la personnalité juridique du CSE (elle ne peut pas agir en justice ni recourir seule à un expert).` },\n    sdc: { name: \"Salarié désigné compétent (interne) ou IPRP (externe)\",\n      who: `En interne, le salarié que l'employeur a l'obligation de désigner pour s'occuper des activités de protection et de prévention des risques professionnels (article L. 4644-1). À l'extérieur, l'IPRP, intervenant en prévention des risques professionnels, qui remplit le même rôle lorsque l'entreprise n'a pas la compétence en interne.`,\n      lever: `Une seule obligation, deux façons de la remplir. La désignation du salarié compétent est soumise à consultation du CSE et ouvre droit à une formation adaptée. À défaut de compétences internes, l'employeur fait appel à un IPRP : soit un IPRP du service de prévention et de santé au travail interentreprises auquel il adhère, soit un IPRP enregistré auprès de la DREETS. L'IPRP peut être ergonome, toxicologue, psychologue du travail, ingénieur sécurité : c'est une compétence technique, pas un statut hiérarchique. Le recours à un IPRP externe est lui aussi précédé de l'avis du CSE.`,\n      not: `Ni le salarié désigné compétent ni l'IPRP ne prennent la responsabilité de l'employeur : ils l'assistent. Et leur désignation ne dispense jamais de la consultation préalable du CSE.` },\n    preventeur: { name: \"Préventeur\",\n      who: `Salarié spécialisé en prévention des risques professionnels au sein de l'entreprise.`,\n      lever: `Soutien technique de l'employeur et du CSE. Il apporte une expertise interne mobilisable sans délai et sans coût externe.`,\n      not: `Il n'a pas de pouvoir de décision ni de pouvoir de contrôle ; il conseille et appuie, il ne sanctionne ni n'arbitre.` },\n    medecin: { name: \"Médecin du travail et son équipe\",\n      who: `Le médecin du travail et le service de prévention et de santé au travail (SPST) auquel il appartient.`,\n      lever: `Contrôle de l'état de santé des salariés lors des visites médicales, qu'elles soient obligatoires ou facultatives. Ce contrôle est de nature médicale, à bien distinguer du contrôle légal de l'inspecteur du travail. Le médecin dispose d'une équipe pluridisciplinaire (infirmier, interne en médecine, psychologue du travail, ergonome, addictologue) qui peut recevoir délégation pour certains actes, ou être mobilisée selon sa spécialité.`,\n      not: `Seul le médecin du travail peut se prononcer sur l'inaptitude : cette compétence ne peut jamais être déléguée à l'équipe pluridisciplinaire.` },\n    inspecteur: { name: \"Inspecteur du travail\",\n      who: `Agent de l'État chargé de veiller au respect du droit du travail dans l'entreprise.`,\n      lever: `Pouvoir de contrôle de la conformité de l'entreprise au Code du travail. Il dispose de pouvoirs généraux (contrôle, mise en demeure, sanction, conseil, information, autorisation) et de trois pouvoirs spéciaux : le prélèvement (direct ou à la charge de l'entreprise), l'arrêt temporaire d'activité, et la saisine du juge des référés pour ordonner des mesures.`,\n      not: `Son contrôle est un contrôle de conformité légale, à distinguer du contrôle du médecin du travail qui porte sur l'état de santé : les deux ne se substituent jamais l'un à l'autre (ex. : les compétences de l'inspecteur permettent d'apprécier la constitution d'un harcèlement, pas le médecin ; mais ce dernier peut analyser l'impact d'une situation sur la santé du salarié).` },\n    carsat: { name: \"Agent CARSAT / CRAMIF\",\n      who: `Agent de l'organisme de sécurité sociale en charge des risques professionnels (Caisse d'assurance retraite et de la santé au travail / Caisse régionale d'assurance maladie d'Île-de-France).`,\n      lever: `Rôle centré sur l'accompagnement et le conseil, même s'il peut prononcer certaines amendes administratives (cotisations supplémentaires, injonctions) ou ordonner à l'employeur d'adopter un plan de prévention. La CARSAT peut également financer de l'accompagnement ou des mesures de prévention (aides financières, contrats de prévention), ce qui en fait un acteur-ressource autant qu'un acteur de contrôle. De plus, ces agents peuvent réaliser des contrôles métrologiques dans les conditions prévues par le Code du travail (contrairement aux organismes techniques qui peuvent parfois ne pas contrôler selon le référentiel).`,\n      not: `Sa logique reste assurantielle et incitative, contrairement à l'inspection du travail dont la logique est avant tout répressive et de conformité légale.` },\n    orgtech: { name: \"Organisme technique\",\n      who: `Prestataire externe spécialisé dans l'accompagnement à la prévention.`,\n      lever: `Intervient contre rémunération pour aider les entreprises à mettre en place ou actualiser leur DUERP, contrôler certaines conditions de travail (bruit, éclairage, qualité de l'air, etc.), ou apporter du conseil (consulting).`,\n      not: `Il n'a aucun pouvoir de contrôle légal ni de sanction : son intervention reste contractuelle, à la demande de l'entreprise.` },\n    inrs: { name: \"INRS / ANACT\",\n      who: `Deux organismes scientifiques et techniques nationaux de référence en santé et conditions de travail.`,\n      lever: `Production de ressources (articles, brochures, outils) et de formations. L'INRS se positionne plutôt sur le volet réglementaire et la prévention des risques, l'ANACT plutôt sur l'amélioration des conditions de travail au sens large.`,\n      not: `Ni l'un ni l'autre n'intervient directement dans l'entreprise avec un pouvoir de contrôle ou de décision : ce sont des centres de ressources, pas des organes d'intervention.` },\n    experts: { name: \"Experts CSE\",\n      who: `Les différents experts que le CSE peut solliciter pour l'accompagner (formateur, juriste, avocat, expert agréé CSE, syndicat, etc.).`,\n      lever: `Apportent un appui technique et juridique au CSE dans l'exercice de ses attributions en matière de prévention, notamment lors de consultations complexes (orientations stratégiques, projets importants, risque grave).`,\n      not: `L'expert assiste le CSE, il ne se substitue pas à lui dans la prise de position ni dans le vote des résolutions.` },\n    prudhommes: { name: \"Les conseils et tribunaux\",\n      who: `Deux juridictions civiles interviennent en santé et sécurité au travail. Le conseil de prud'hommes, juridiction paritaire, tranche les litiges individuels nés du contrat de travail. Le tribunal judiciaire prend le relais pour le reste : le collectif, l'action du CSE et le référé engagé par l'inspecteur du travail.`,\n      lever: `Le conseil de prud'hommes agit sur deux terrains. Sa formation de référé (articles R. 1455-5 et R. 1455-6) peut, même en présence d'une contestation sérieuse, prescrire les mesures conservatoires ou de remise en état nécessaires pour prévenir un dommage imminent ou faire cesser un trouble manifestement illicite : un manquement caractérisé à l'obligation de sécurité en relève (équipements de protection non fournis, issues de secours condamnées, durées maximales de travail dépassées). Il tranche aussi la contestation des avis, propositions, conclusions écrites ou indications du médecin du travail (article L. 4624-7) : le salarié comme l'employeur le saisissent selon la procédure accélérée au fond, dans les quinze jours de la notification. Sa décision se substitue à l'avis contesté, il peut confier une mesure d'instruction au médecin inspecteur du travail, et le médecin du travail n'est pas partie au litige. Le tribunal judiciaire, lui, est le juge du collectif. C'est son président que l'inspecteur du travail saisit en référé lorsqu'un risque sérieux d'atteinte à l'intégrité physique résulte d'un manquement (article L. 4732-1), pour ordonner la mise hors service, l'immobilisation, la saisie de matériels ou la fermeture temporaire d'un atelier ou d'un chantier, au besoin sous astreinte. C'est aussi devant lui que le CSE agit en référé, par exemple pour faire cesser une entrave ou obtenir la communication de documents.`,\n      not: `Ni l'un ni l'autre ne pilote la prévention : ils tranchent un litige ou ordonnent une mesure, ils ne se substituent pas à l'employeur. Et ils ne jugent pas les décisions de l'inspection du travail : l'employeur qui conteste la réalité du danger ou un arrêt temporaire de travaux saisit le juge administratif en référé (article L. 4731-4), tandis que les mises en demeure passent d'abord par un recours devant la DREETS (article L. 4723-1).` }\n  };\n\n  // 12 cas, deux etapes chacun. Étape 1 : une première décision. Puis un blocage\n  // qui oblige à changer de fusil d'épaule, et une étape 2 avec d'autres acteurs.\n  // Chaque option est typée : \"attendu\", \"recevable\" ou \"hors\" (hors sujet).\n  // Les 13 fiches acteurs sont chacune proposee au moins une fois sur le parcours.\n  CASES = [\n\n    { id: \"c1\", tag: \"Danger grave et imminent\",\n      situation: `Une fuite de produit dangereux se répand près d'un poste de travail. La personne qui y travaille a un motif raisonnable de penser qu'elle est exposée à un danger grave et imminent.`,\n      steps: [\n        { question: `Qui peut se retirer immédiatement de la situation ?`,\n          options: [\n            { actor: \"salarie\", status: \"attendu\", label: `Le salarié exposé`,\n              why: `Droit de retrait individuel et immédiat : il se retire et signale la situation, sans attendre la moindre validation.` },\n            { actor: \"encadrant\", status: \"recevable\", label: `L'encadrant de proximité`,\n              why: `Recevable s'il est lui-même exposé. Mais il n'a pas le pouvoir de retirer autrui : il alerte et fait évacuer.` },\n            { actor: \"medecin\", status: \"hors\", label: `Le médecin du travail`,\n              why: `Hors sujet : son champ est la santé, pas l'urgence opérationnelle.` },\n            { actor: \"cse\", status: \"hors\", label: `Le CSE`,\n              why: `Hors sujet à ce stade : le retrait est un droit individuel, pas une décision d'instance.` }\n          ],\n          retenir: `Le droit de retrait s'exerce sans autorisation préalable. Le principe de prudence du salarié ne transfère jamais la responsabilité de l'employeur.`,\n          fiches: [\"salarie\"] },\n        { blocage: `L'employeur conteste le retrait et exige la reprise du poste.`,\n          question: `Le salarié saisit son représentant au CSE : que fait ce dernier ?`,\n          options: [\n            { actor: \"cse\", status: \"attendu\", label: `Exercer le droit d'alerte pour danger grave et imminent, le consigner au registre spécial et déclencher l'enquête conjointe avec l'employeur`,\n              why: `C'est la procédure prévue : alerte, consignation au registre spécial, puis enquête conjointe immédiate avec l'employeur.` },\n            { actor: \"inspecteur\", status: \"recevable\", label: `Saisir directement l'inspecteur du travail`,\n              why: `Attendu, mais potentiellement prématuré : la saisine intervient en principe en cas de désaccord à l'issue de l'enquête conjointe. Elle devient immédiate si l'employeur refuse cette enquête ou ne la met pas en œuvre.` },\n            { actor: \"medecin\", status: \"hors\", label: `Convoquer le médecin du travail pour arbitrer`,\n              why: `Hors sujet : il n'arbitre pas un danger technique.` },\n            { actor: \"employeur\", status: \"hors\", label: `Attendre la réponse de l'employeur avant d'agir`,\n              why: `Hors sujet : une alerte pour danger grave et imminent ne souffre aucune attente.` }\n          ],\n          retenir: `Le CSE n'a pas de pouvoir de décision, mais il a le pouvoir de déclencher : alerte, registre, enquête, puis mobilisation de l'inspecteur du travail en cas de désaccord.`,\n          fiches: [\"cse\"] }\n      ] },\n\n    { id: \"c2\", tag: \"DUERP incomplet\",\n      situation: `Depuis une évolution récente du process, un produit chimique est utilisé sur un poste. Un salarié constate que le DUERP n'en fait aucune mention.`,\n      steps: [\n        { question: `Quel acteur alerter en premier ?`,\n          options: [\n            { actor: \"encadrant\", status: \"attendu\", label: `L'encadrant de proximité`,\n              why: `L'échelon de terrain le plus rapide et le plus légitime pour faire remonter l'anomalie ; ou, si le salarié préfère, son représentant de proximité au CSE.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail`,\n              why: `Hors sujet en première intention : il intervient en cas d'inaction ou de désaccord persistant.` },\n            { actor: \"carsat\", status: \"hors\", label: `La CARSAT`,\n              why: `Hors sujet ici : sa logique est l'accompagnement et le financement, pas la remontée d'une anomalie interne.` },\n            { actor: \"inrs\", status: \"hors\", label: `L'INRS`,\n              why: `Hors sujet : centre de ressources documentaires, il n'intervient pas dans l'entreprise.` }\n          ],\n          retenir: `La remontée d'information de terrain est le premier maillon : sans elle, l'évaluation des risques reste théorique.`,\n          fiches: [\"encadrant\"] },\n        { blocage: `L'encadrant confirme le manque, mais personne ne sait qui doit actualiser le document unique.`,\n          question: `Sur qui l'employeur doit-il s'appuyer en interne pour actualiser l'évaluation des risques ?`,\n          options: [\n            { actor: \"sdc\", status: \"attendu\", label: `Le salarié désigné compétent`,\n              why: `C'est précisément sa mission : l'employeur a l'obligation de désigner en interne un salarié compétent pour les activités de protection et de prévention (article L. 4644-1), après consultation du CSE.` },\n            { actor: \"preventeur\", status: \"recevable\", label: `Le préventeur de l'entreprise, s'il en existe un`,\n              why: `Recevable et complémentaire : il apporte l'expertise technique interne, sans délai ni coût externe.` },\n            { actor: \"orgtech\", status: \"recevable\", label: `Un organisme technique extérieur`,\n              why: `Recevable mais externe et payant : à réserver à ce qui ne peut pas être fait en interne.` },\n            { actor: \"medecin\", status: \"hors\", label: `Le médecin du travail`,\n              why: `Hors sujet pour la tenue du document : il conseille sur le volet santé, il ne rédige pas le DUERP.` }\n          ],\n          retenir: `La mise à jour du DUERP reste l'obligation de l'employeur. Le salarié désigné compétent et le préventeur l'assistent, ils ne le remplacent pas.`,\n          fiches: [\"sdc\"] }\n      ] },\n\n    { id: \"c3\", tag: \"Responsabilité\",\n      situation: `Un nouveau procédé industriel est mis en place. Il faut arrêter la politique de prévention associée et débloquer les moyens : équipements, formation, organisation.`,\n      steps: [\n        { question: `À qui incombe en premier lieu cette responsabilité ?`,\n          options: [\n            { actor: \"employeur\", status: \"attendu\", label: `À l'employeur`,\n              why: `Il détient le pouvoir de direction : la responsabilité juridique de la santé et de la sécurité lui incombe en premier lieu.` },\n            { actor: \"preventeur\", status: \"hors\", label: `Au préventeur`,\n              why: `Hors sujet comme décideur : il assiste. Il peut toutefois recevoir une délégation de pouvoir lui attribuant missions et moyens, et donc une part de responsabilité.` },\n            { actor: \"cse\", status: \"hors\", label: `Au CSE`,\n              why: `Hors sujet comme décideur. C'est un acteur-levier, notamment dans le cadre d'une consultation préalable.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `À l'inspecteur du travail`,\n              why: `Hors sujet : il contrôle, il ne pilote pas la prévention de l'entreprise.` }\n          ],\n          retenir: `Toute la chaîne de prévention part de l'employeur : il ne peut pas se défausser sur ceux qui l'assistent.`,\n          fiches: [\"employeur\"] },\n        { blocage: `L'entreprise ne dispose pas en interne des compétences nécessaires pour évaluer les risques du nouveau procédé.`,\n          question: `Que doit faire l'employeur pour organiser malgré tout la prévention ?`,\n          options: [\n            { actor: \"sdc\", status: \"attendu\", label: `Faire appel à un IPRP du service de prévention et de santé au travail, ou à un IPRP agréé par la DREETS`,\n              why: `C'est exactement ce que prévoit l'article L. 4644-1 lorsque les compétences internes font défaut.` },\n            { actor: \"medecin\", status: \"recevable\", label: `S'appuyer sur le médecin du travail pour conduire l'évaluation`,\n              why: `Recevable en appui : le SPST conseille et éclaire, mais il ne porte pas l'obligation d'évaluation.` },\n            { actor: \"orgtech\", status: \"hors\", label: `Confier la mission à un organisme technique sans consulter le CSE`,\n              why: `Hors sujet : la consultation du CSE est un préalable, quel que soit l'intervenant retenu.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `Attendre un contrôle de l'inspection du travail`,\n              why: `Hors sujet : l'obligation de prévention est proactive, elle ne se déclenche pas sur contrôle.` }\n          ],\n          retenir: `Faute de compétences internes, l'employeur va les chercher à l'extérieur. L'obligation, elle, ne se délègue pas.`,\n          fiches: [\"sdc\"] }\n      ] },\n\n    { id: \"c4\", tag: \"Consultation préalable\",\n      situation: `L'employeur annonce en réunion qu'il va désigner un salarié compétent en prévention. Le CSE n'en a jamais été saisi.`,\n      steps: [\n        { question: `Quelle est l'irrégularité ?`,\n          options: [\n            { actor: \"cse\", status: \"attendu\", label: `Le CSE aurait dû être consulté avant la désignation`,\n              why: `L'article L. 4644-1 impose une consultation préalable du CSE, et non une simple information.` },\n            { actor: \"employeur\", status: \"hors\", label: `Il n'y a aucune irrégularité : la désignation relève du seul employeur`,\n              why: `Hors sujet : le pouvoir de désignation est bien celui de l'employeur, mais il s'exerce après consultation.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail aurait dû valider la désignation`,\n              why: `Hors sujet : il contrôle le respect de la procédure, il ne valide pas le choix de la personne.` },\n            { actor: \"medecin\", status: \"hors\", label: `Le médecin du travail aurait dû donner son accord`,\n              why: `Hors sujet : il n'intervient pas dans le processus de désignation.` }\n          ],\n          retenir: `Consultation préalable n'est pas information. L'ordre des étapes fait partie de la règle.`,\n          fiches: [\"cse\"] },\n        { blocage: `Malgré le rappel du CSE, l'employeur maintient la désignation en l'état.`,\n          question: `Que peut faire le CSE ?`,\n          options: [\n            { actor: \"inspecteur\", status: \"attendu\", label: `Saisir l'inspecteur du travail pour défaut de consultation`,\n              why: `C'est le manquement type qu'il constate et fait cesser.` },\n            { actor: \"cse\", status: \"recevable\", label: `Voter une résolution actant le désaccord`,\n              why: `Recevable : cela formalise et trace le désaccord, sans contraindre l'employeur.` },\n            { actor: \"cse\", status: \"recevable\", label: `Saisir directement le juge des référés`,\n              why: `Recevable mais lourd : nous recommandons cette saisine après l'intervention de l'inspecteur du travail.` },\n            { actor: \"experts\", status: \"hors\", label: `Recourir à une expertise`,\n              why: `Hors sujet : ni risque grave ni projet important, seulement un vice de procédure.` }\n          ],\n          retenir: `Face à un vice de procédure, le CSE dispose d'une gradation : formaliser, alerter le contrôle, puis seulement contraindre par le juge.`,\n          fiches: [\"inspecteur\"] }\n      ] },\n\n    { id: \"c5\", tag: \"Suivi de l'état de santé\",\n      situation: `Un salarié reprend le travail après un arrêt long. Son poste comporte des contraintes physiques et son état de santé doit être apprécié avant la reprise.`,\n      steps: [\n        { question: `Quel acteur est compétent pour se prononcer sur l'aptitude ?`,\n          options: [\n            { actor: \"medecin\", status: \"attendu\", label: `Le médecin du travail`,\n              why: `Seul compétent pour statuer sur l'aptitude ou l'inaptitude. Cette compétence-là ne se délègue jamais, contrairement à d'autres actes qu'il peut confier à son équipe pluridisciplinaire.` },\n            { actor: \"medecin\", status: \"recevable\", label: `L'infirmier ou un autre membre de l'équipe pluridisciplinaire`,\n              why: `Recevable pour des actes délégués, jamais pour la décision d'aptitude ou d'inaptitude.` },\n            { actor: \"encadrant\", status: \"hors\", label: `L'encadrant du salarié`,\n              why: `Hors sujet : il signale et adapte au quotidien, il ne statue pas sur la santé.` },\n            { actor: \"employeur\", status: \"hors\", label: `L'employeur`,\n              why: `Hors sujet : il met en œuvre les préconisations, il ne juge pas de l'état de santé.` }\n          ],\n          retenir: `L'aptitude est une décision médicale. Elle n'appartient ni à la hiérarchie, ni à l'employeur.`,\n          fiches: [\"medecin\"] },\n        { blocage: `Le médecin conclut à une aptitude avec réserves : le poste doit être aménagé, ce que l'employeur juge difficile.`,\n          question: `Comment aboutir concrètement à l'aménagement ?`,\n          options: [\n            { actor: \"employeur\", status: \"attendu\", label: `L'employeur met en œuvre les préconisations, appuyé par l'ergonome du SPST et, en interne, par le préventeur ou le salarié désigné compétent`,\n              why: `C'est la voie normale : les préconisations s'imposent à l'employeur, qui va chercher l'appui technique nécessaire pour les rendre réalisables.` },\n            { actor: \"prudhommes\", status: \"attendu\", label: `Contester les préconisations en saisissant un juge`,\n              why: `Attendu si l'employeur, ou le salarié, est en désaccord avec l'avis : c'est la voie prévue par l'article L. 4624-7. On saisit le conseil de prud'hommes selon la procédure accélérée au fond, dans les quinze jours de la notification. Attention, l'avis reste applicable tant que le juge n'a pas statué.` },\n            { actor: \"encadrant\", status: \"hors\", label: `Régler la question de gré à gré entre le salarié et son encadrant`,\n              why: `Hors sujet : un avis du médecin du travail ne se négocie pas de gré à gré.` },\n            { actor: \"employeur\", status: \"hors\", label: `Ignorer les réserves et remettre le salarié à son poste`,\n              why: `Hors sujet et fautif : l'employeur est tenu de prendre les réserves en compte.` }\n          ],\n          retenir: `Un avis avec réserves engage l'employeur. La seule alternative à la mise en œuvre est de saisir un juge, jamais l'inaction.`,\n          fiches: [\"employeur\", \"prudhommes\"] }\n      ] },\n\n    { id: \"c6\", tag: \"Appui technique interne\",\n      situation: `L'employeur et le CSE veulent un appui technique interne, mobilisable vite et sans coût externe, pour structurer le DUERP.`,\n      steps: [\n        { question: `Quel acteur interne solliciter ?`,\n          options: [\n            { actor: \"preventeur\", status: \"attendu\", label: `Le préventeur de l'entreprise`,\n              why: `Expertise interne, mobilisable sans délai et sans coût externe, en soutien de l'employeur comme du CSE.` },\n            { actor: \"orgtech\", status: \"recevable\", label: `Un organisme technique`,\n              why: `Recevable mais externe et payant : à réserver aux mesures qu'on ne peut pas faire en interne.` },\n            { actor: \"encadrant\", status: \"hors\", label: `L'encadrement`,\n              why: `Hors sujet pour la structuration méthodologique, sauf s'il fait partie des acteurs en place dans la démarche d'évaluation des risques, où sa contribution devient précieuse.` },\n            { actor: \"salarie\", status: \"hors\", label: `Les salariés eux-mêmes`,\n              why: `Hors sujet pour la méthode, sauf compétences ou expérience particulières en la matière. Leur connaissance du travail réel reste, elle, indispensable.` }\n          ],\n          retenir: `Le préventeur conseille et outille. Il n'a ni pouvoir de décision, ni pouvoir de contrôle.`,\n          fiches: [\"preventeur\"] },\n        { blocage: `Le préventeur bute sur un risque chimique dont l'impact sur la santé dépasse sa qualification.`,\n          question: `Vers qui oriente-t-il ?`,\n          options: [\n            { actor: \"medecin\", status: \"attendu\", label: `Le médecin du travail et l'équipe pluridisciplinaire du SPST`,\n              why: `C'est le bon canal dès que l'enjeu devient l'impact sur la santé.` },\n            { actor: \"orgtech\", status: \"recevable\", label: `Un organisme technique, pour objectiver l'exposition par la mesure`,\n              why: `Recevable et complémentaire : la mesure objective ce que l'analyse ne fait que soupçonner.` },\n            { actor: \"carsat\", status: \"recevable\", label: `La CARSAT, pour un accompagnement`,\n              why: `Recevable : conseil, accompagnement méthodologique et, le cas échéant, financement.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail`,\n              why: `Hors sujet à ce stade : aucun manquement à contrôler, seulement une compétence à compléter.` }\n          ],\n          retenir: `Connaître la limite de sa qualification et passer la main fait partie du métier de préventeur.`,\n          fiches: [\"medecin\"] }\n      ] },\n\n    { id: \"c7\", tag: \"Épuisement professionnel\",\n      situation: `Un encadrant remarque des signes répétés d'épuisement chez un salarié : fatigue visible, erreurs inhabituelles, isolement.`,\n      steps: [\n        { question: `Vers quel acteur orienter d'abord ce cas individuel ?`,\n          options: [\n            { actor: \"medecin\", status: \"attendu\", label: `Le médecin du travail et son équipe`,\n              why: `C'est un sujet de santé : le canal est le SPST, notamment le psychologue du travail s'il y en a un.` },\n            { actor: \"encadrant\", status: \"recevable\", label: `L'encadrant, qui traite lui-même la situation`,\n              why: `Recevable pour constater les signaux et agir sur l'organisation de son équipe, mais il ne peut pas analyser l'état de santé du salarié.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail`,\n              why: `Hors sujet à ce stade : rien n'indique un manquement à contrôler.` },\n            { actor: \"carsat\", status: \"hors\", label: `La CARSAT`,\n              why: `Hors sujet en première intention : elle accompagne des démarches collectives, pas un cas individuel.` }\n          ],\n          retenir: `Vigilance et alerte pour l'encadrant, appréciation de la santé pour le médecin : chacun dans son champ.`,\n          fiches: [\"medecin\"] },\n        { blocage: `Le médecin du travail constate que plusieurs personnes du même service présentent les mêmes signes : le problème est collectif et organisationnel.`,\n          question: `Comment le CSE s'en saisit-il ?`,\n          options: [\n            { actor: \"experts\", status: \"attendu\", label: `Recourir à une expertise pour risque grave`,\n              why: `Le seuil est atteint : la situation collective justifie une expertise pour risque grave.` },\n            { actor: \"carsat\", status: \"recevable\", label: `Mobiliser la CARSAT pour un accompagnement et un financement`,\n              why: `Recevable : accompagnement méthodologique et, le cas échéant, financement de l'action.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `Demander à l'inspecteur du travail de constater l'état de santé dégradé des salariés`,\n              why: `Hors sujet : constater l'état de santé relève du médecin du travail, pas des compétences de l'inspecteur.` },\n            { actor: \"cse\", status: \"hors\", label: `Attendre la prochaine consultation annuelle`,\n              why: `Hors sujet : le CSE n'a pas à attendre un rendez-vous de calendrier pour se saisir d'un risque grave.` }\n          ],\n          retenir: `Un cumul de situations individuelles qui se ressemblent est un signal collectif : il change d'acteur et de moyens.`,\n          fiches: [\"experts\"] }\n      ] },\n\n    { id: \"c8\", tag: \"Machine non conforme\",\n      situation: `Une machine est dépourvue de son dispositif de protection. Un danger grave et imminent est constaté, mais aucun salarié n'exerce son droit de retrait.`,\n      steps: [\n        { question: `Que doit-il se passer en premier ?`,\n          options: [\n            { actor: \"employeur\", status: \"attendu\", label: `L'employeur arrête lui-même l'activité et met la machine en conformité`,\n              why: `C'est son obligation directe et immédiate : il n'a pas à attendre un contrôle pour agir.` },\n            { actor: \"inspecteur\", status: \"recevable\", label: `L'inspecteur du travail intervient et ordonne l'arrêt`,\n              why: `Attendu, mais en second : il agit si l'employeur ne le fait pas.` },\n            { actor: \"carsat\", status: \"hors\", label: `La CARSAT impose la mise en conformité`,\n              why: `Hors sujet pour la contrainte : sa logique est incitative et assurantielle.` },\n            { actor: \"orgtech\", status: \"hors\", label: `Un organisme technique est missionné pour trancher`,\n              why: `Hors sujet : aucun pouvoir de contrainte, son intervention reste contractuelle.` }\n          ],\n          retenir: `L'ordre compte : l'obligation de l'employeur précède toujours l'intervention du contrôle.`,\n          fiches: [\"employeur\"] },\n        { blocage: `L'employeur ne fait rien.`,\n          question: `L'inspecteur du travail est saisi : que fait-il ?`,\n          options: [\n            { actor: \"inspecteur\", status: \"attendu\", label: `Il prononce l'arrêt temporaire d'activité`,\n              why: `Possible si toutes les conditions sont réunies : danger grave et imminent, aucun droit de retrait exercé, et situation figurant dans la liste limitative du Code du travail.` },\n            { actor: \"inspecteur\", status: \"recevable\", label: `Il saisit le juge des référés`,\n              why: `Recevable, et c'est la voie si les conditions de l'arrêt temporaire ne sont pas réunies : le juge peut ordonner des mesures sous astreinte.` },\n            { actor: \"carsat\", status: \"recevable\", label: `Il sollicite la CARSAT pour accompagner l'entreprise`,\n              why: `Recevable mais trop tard : l'accompagnement n'a plus sa place face à un danger caractérisé et à l'inaction.` },\n            { actor: \"employeur\", status: \"hors\", label: `Il attend qu'un accident survienne pour caractériser le manquement`,\n              why: `Hors sujet : le manquement est déjà caractérisé, l'attente serait elle-même fautive.` }\n          ],\n          retenir: `Trois pouvoirs spéciaux : le prélèvement, l'arrêt temporaire d'activité et la saisine du juge des référés.`,\n          fiches: [\"inspecteur\"] }\n      ] },\n\n    { id: \"c9\", tag: \"Financement d'un investissement\",\n      situation: `Le CSE veut que l'entreprise investisse dans du matériel d'aide à la manutention, mais le budget bloque le projet.`,\n      steps: [\n        { question: `Quel acteur externe peut financer une partie de la mesure ?`,\n          options: [\n            { actor: \"carsat\", status: \"attendu\", label: `L'agent CARSAT / CRAMIF`,\n              why: `Aides financières et contrats de prévention, sous conditions, notamment d'effectif : subvention prévention pour les entreprises de moins de 50 salariés, contrat de prévention en deçà de 200, et aides ciblées comme la subvention ergonomie.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail`,\n              why: `Hors sujet : il contrôle, il ne finance pas.` },\n            { actor: \"orgtech\", status: \"hors\", label: `Un organisme technique`,\n              why: `Hors sujet : c'est un prestataire payant, pas un financeur.` },\n            { actor: \"preventeur\", status: \"hors\", label: `Le préventeur de l'entreprise`,\n              why: `Hors sujet pour le financement : il construit le dossier technique, il ne l'abonde pas.` }\n          ],\n          retenir: `La CARSAT est autant un acteur-ressource qu'un acteur de contrôle.`,\n          fiches: [\"carsat\"] },\n        { blocage: `La CARSAT conditionne son aide à un diagnostic objectivant le risque de troubles musculo-squelettiques.`,\n          question: `Qui réalise ce diagnostic ?`,\n          options: [\n            { actor: \"medecin\", status: \"attendu\", label: `L'ergonome de l'équipe pluridisciplinaire du SPST`,\n              why: `C'est la compétence dédiée au sein du service de prévention et de santé au travail.` },\n            { actor: \"orgtech\", status: \"attendu\", label: `Un organisme technique`,\n              why: `Également attendu : instrumentation et qualification pour objectiver l'exposition par la mesure.` },\n            { actor: \"preventeur\", status: \"recevable\", label: `Le préventeur en interne, s'il est outillé`,\n              why: `Recevable, dans la limite de sa qualification et de ses moyens de mesure.` },\n            { actor: \"cse\", status: \"hors\", label: `Le CSE seul, à partir de ses inspections`,\n              why: `Hors sujet : il déclenche le diagnostic et l'exploite, il ne le réalise pas.` }\n          ],\n          retenir: `Le financement se gagne sur la preuve : c'est le diagnostic qui ouvre l'aide.`,\n          fiches: [\"medecin\", \"orgtech\"] }\n      ] },\n\n    { id: \"c10\", tag: \"Mesure du bruit\",\n      situation: `Plusieurs salariés se plaignent d'un niveau sonore élevé sur une ligne de production, sans qu'aucune mesure précise n'existe.`,\n      steps: [\n        { question: `Qui peut réaliser une mesure fiable du bruit ?`,\n          options: [\n            { actor: \"carsat\", status: \"attendu\", label: `La CARSAT`,\n              why: `Ses agents peuvent réaliser des contrôles métrologiques dans les conditions prévues par le Code du travail.` },\n            { actor: \"orgtech\", status: \"recevable\", label: `Un organisme technique`,\n              why: `Recevable : instrumentation et qualification. Attention toutefois, leurs analyses ne retiennent pas toujours les précisions et les seuils réglementaires.` },\n            { actor: \"preventeur\", status: \"recevable\", label: `Le préventeur`,\n              why: `Recevable s'il dispose d'un sonomètre calibré, ce qui est rarement le cas.` },\n            { actor: \"encadrant\", status: \"hors\", label: `L'encadrant`,\n              why: `Hors sujet : ni instrument, ni qualification.` }\n          ],\n          retenir: `Mesurer n'est pas constater : la valeur d'une mesure tient au référentiel qu'elle applique.`,\n          fiches: [\"carsat\"] },\n        { blocage: `La mesure confirme un dépassement des valeurs limites d'exposition.`,\n          question: `Que fait l'employeur, appuyé par le CSE ?`,\n          options: [\n            { actor: \"employeur\", status: \"attendu\", label: `Mettre en œuvre un plan de réduction du bruit : protection collective d'abord, EPI ensuite, et adapter le suivi médical`,\n              why: `C'est l'ordre imposé par les principes généraux de prévention.` },\n            { actor: \"carsat\", status: \"recevable\", label: `Solliciter la CARSAT pour financer les mesures correctives`,\n              why: `Recevable et cohérent : l'aide financière soutient l'investissement de protection collective.` },\n            { actor: \"medecin\", status: \"recevable\", label: `Confier le suivi individuel des salariés exposés au médecin du travail`,\n              why: `Recevable et complémentaire : le suivi médical accompagne la réduction à la source, il ne la remplace pas.` },\n            { actor: \"salarie\", status: \"hors\", label: `Distribuer des bouchons d'oreille à tous les postes`,\n              why: `Hors sujet comme réponse principale : l'EPI ne prime jamais sur la protection collective.` }\n          ],\n          retenir: `L'EPI ferme la marche des neuf principes généraux de prévention, il ne l'ouvre pas.`,\n          fiches: [\"employeur\"] }\n      ] },\n\n    { id: \"c11\", tag: \"Ressources nationales\",\n      situation: `La CSSCT veut construire une action de sensibilisation aux RPS et cherche des outils méthodologiques fiables et gratuits.`,\n      steps: [\n        { question: `Vers quel organisme de ressources se tourner en priorité ?`,\n          options: [\n            { actor: \"inrs\", status: \"attendu\", label: `L'ANACT`,\n              why: `Vocation d'amélioration des conditions de travail, RPS compris : outils et méthodologies en accès libre.` },\n            { actor: \"inrs\", status: \"attendu\", label: `L'INRS`,\n              why: `Également attendu : registre plus réglementaire que l'ANACT, avec des ressources et des outils RPS existants.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `L'inspecteur du travail`,\n              why: `Hors sujet : il contrôle, il n'est pas un centre de ressources.` },\n            { actor: \"orgtech\", status: \"hors\", label: `Un organisme technique`,\n              why: `Hors sujet pour de la ressource méthodologique gratuite : son intervention est payante.` }\n          ],\n          retenir: `INRS et ANACT produisent la ressource. Ni l'un ni l'autre n'intervient dans l'entreprise.`,\n          fiches: [\"inrs\"] },\n        { blocage: `La sensibilisation révèle une situation collective dégradée, qui dépasse largement la communication.`,\n          question: `Comment passer de la ressource à l'action dans l'entreprise ?`,\n          options: [\n            { actor: \"experts\", status: \"attendu\", label: `Engager un diagnostic organisationnel avec un expert du CSE`,\n              why: `On sort de la ressource nationale pour un intervenant de terrain, capable d'analyser l'organisation réelle.` },\n            { actor: \"carsat\", status: \"attendu\", label: `Solliciter la CARSAT pour un accompagnement`,\n              why: `Également attendu : elle accompagne la démarche sur le terrain et peut la financer.` },\n            { actor: \"medecin\", status: \"recevable\", label: `Associer le médecin du travail sur le volet santé`,\n              why: `Recevable et complémentaire : il éclaire l'impact de la situation sur la santé.` },\n            { actor: \"inrs\", status: \"hors\", label: `S'en tenir à la documentation diffusée`,\n              why: `Hors sujet : insuffisant face à une situation collective avérée.` }\n          ],\n          retenir: `La ressource éclaire ; seul un intervenant de terrain transforme.`,\n          fiches: [\"experts\", \"carsat\"] }\n      ] },\n\n    { id: \"c12\", tag: \"Orientations stratégiques\",\n      situation: `Dans le cadre de la consultation sur les orientations stratégiques, l'entreprise annonce une réorganisation majeure avec un risque de fermeture de site. Le CSE veut comprendre les enjeux financiers et industriels avant de rendre son avis.`,\n      steps: [\n        { question: `Quel acteur le CSE peut-il mobiliser ?`,\n          options: [\n            { actor: \"experts\", status: \"attendu\", label: `Un expert-comptable, expert du CSE`,\n              why: `Le CSE dispose d'un droit à l'expertise sur les orientations stratégiques.` },\n            { actor: \"medecin\", status: \"hors\", label: `Le médecin du travail`,\n              why: `Hors sujet pour l'analyse financière : son champ est la santé.` },\n            { actor: \"orgtech\", status: \"hors\", label: `Un organisme technique`,\n              why: `Hors sujet : sa spécialité est la mesure et le conseil en prévention, pas l'analyse économique.` },\n            { actor: \"carsat\", status: \"hors\", label: `La CARSAT`,\n              why: `Hors sujet : son champ est la prévention des risques professionnels.` }\n          ],\n          retenir: `L'expert éclaire le CSE. Il ne se substitue ni à sa position, ni à son vote.`,\n          fiches: [\"experts\"] },\n        { blocage: `L'expertise révèle que la réorganisation envisagée dégradera fortement les conditions de travail des postes maintenus.`,\n          question: `Comment le CSE prolonge-t-il sa démarche ?`,\n          options: [\n            { actor: \"medecin\", status: \"attendu\", label: `Demander au médecin du travail une analyse de l'impact sur la santé`,\n              why: `Il complète l'analyse économique par le volet santé, ce qui étaye l'avis rendu par le CSE.` },\n            { actor: \"inspecteur\", status: \"hors\", label: `Saisir l'inspecteur du travail`,\n              why: `Hors sujet : aucun manquement n'est constitué, la procédure de consultation suit son cours.` },\n            { actor: \"cse\", status: \"hors\", label: `Se limiter à un avis défavorable non étayé`,\n              why: `Hors sujet : un avis motivé suppose l'appui technique qui vient précisément d'être réuni.` },\n            { actor: \"cse\", status: \"hors\", label: `Refuser de rendre un avis`,\n              why: `Hors sujet : le refus prive le CSE de l'occasion de faire valoir ses analyses.` }\n          ],\n          retenir: `Un avis pèse par ce qui l'étaye : économie, organisation et santé.`,\n          fiches: [\"medecin\"] }\n      ] }\n  ];\n\n  // Memo de fin de partie : l'essentiel de chaque acteur en une phrase,\n  // acteurs internes a l'entreprise d'abord, intervenants externes ensuite.\n  INTERNES = [\"employeur\", \"encadrant\", \"salarie\", \"cse\", \"sdc\", \"preventeur\"];\n  EXTERNES = [\"medecin\", \"inspecteur\", \"carsat\", \"orgtech\", \"inrs\", \"experts\", \"prudhommes\"];\n\n  MEMO = {\n    employeur:  `Décide et organise, donc responsable.`,\n    encadrant:  `Moteur et bénéficiaire, donc il lui faut des formations et des moyens.`,\n    salarie:    `Premier exposé et premier informé : il applique, il alerte, il se retire face à un danger grave et imminent.`,\n    cse:        `Ne décide pas mais propose et déclenche, donc levier.`,\n    sdc:        `La compétence prévention que l'employeur doit désigner en interne, ou aller chercher dehors avec un IPRP.`,\n    preventeur: `Expertise interne, sans délai ni coût : il conseille et outille, il ne décide pas.`,\n    medecin:    `Seul juge de l'aptitude ; avec son équipe, il éclaire l'effet du travail sur la santé.`,\n    inspecteur: `Contrôle la conformité de l'entreprise au Code du travail, mais peut aussi informer, conseiller, mettre en demeure, arrêter une activité ou saisir le juge.`,\n    carsat:     `Accompagne, mesure et finance : logique assurantielle et incitative plutôt que répressive.`,\n    orgtech:    `Prestataire payant : il mesure et objective, sans aucun pouvoir de contrainte.`,\n    inrs:       `Centres de ressources nationaux : ils produisent la méthode, ils n'interviennent pas dans l'entreprise.`,\n    experts:    `Appui technique et juridique du CSE : ils éclairent l'avis, ils ne le rendent pas.`,\n    prudhommes: `Le conseil de prud'hommes tranche le litige individuel ; le tribunal judiciaire, saisi par l'inspecteur ou par le CSE, ordonne l'arrêt et fait cesser l'entrave.`\n  };\n\n  goHome = () => this.setState({ screen: \"home\", openActorId: null });\n  goCases = () => this.setState({ screen: \"cases\", caseIndex: 0, step: 0, answers: {}, read: {}, openActorId: null });\n  // Ouvrir une fiche, et se souvenir qu'elle a ete lue pour l'etape en cours.\n  openFiche = (id) => this.setState(s => ({\n    openActorId: id,\n    read: { ...s.read, [s.caseIndex + \"-\" + s.step + \"-\" + id]: true }\n  }));\n  closeFiche = () => this.setState({ openActorId: null });\n  stop = (e) => { e.stopPropagation(); };\n\n  pick = (i) => {\n    const ci = this.state.caseIndex, st = this.state.step, k = ci + \"-\" + st;\n    if (this.state.answers[k] !== undefined) return;\n    // Le joueur decouvre d'abord son verdict (attendu / recevable / hors sujet).\n    // Les fiches acteurs ne s'ouvrent que s'il les demande depuis le verdict.\n    this.setState(s => ({ answers: { ...s.answers, [k]: i }, openActorId: null }));\n  };\n\n  next = () => {\n    const ci = this.state.caseIndex, st = this.state.step;\n    // On ne quitte pas l'etape tant que ses fiches acteurs n'ont pas ete ouvertes.\n    if (!this.CASES[ci].steps[st].fiches.every(id => this.state.read[ci + \"-\" + st + \"-\" + id])) return;\n    if (st === 0) this.setState({ step: 1, openActorId: null });\n    else if (ci >= this.CASES.length - 1) this.setState({ screen: \"recap\", openActorId: null });\n    else this.setState({ caseIndex: ci + 1, step: 0, openActorId: null });\n  };\n\n  renderVals() {\n    const S = this.state;\n    const A = this.ACTORS;\n\n    const ci = S.caseIndex, st = S.step;\n    const cs = this.CASES[ci];\n    const stp = cs.steps[st];\n    const choice = S.answers[ci + \"-\" + st];\n    const answered = choice !== undefined;\n    const picked = answered ? stp.options[choice] : null;\n\n    const LETTERS = [\"A\", \"B\", \"C\", \"D\", \"E\"];\n    const TONE = {\n      attendu:   { card: \"background:var(--c-good-bg);border-color:var(--c-good);\", badge: \"background:var(--c-good);color:#fff;\",\n                   mark: \"✓\", icon: \"background:var(--c-good);\", title: \"Bien vu !\" },\n      recevable: { card: \"background:var(--c-alt-bg);border-color:var(--c-alt);\", badge: \"background:var(--c-alt);color:#fff;\",\n                   mark: \"≈\", icon: \"background:var(--c-alt);\", title: \"Recevable, mais…\" },\n      hors:      { card: \"background:var(--c-off-bg);border-color:var(--c-off);opacity:.6;\", badge: \"background:var(--c-off);color:#fff;\",\n                   mark: \"✕\", icon: \"background:var(--c-off);\", title: \"Pas tout à fait\" }\n    };\n\n    const options = stp.options.map((o, i) => {\n      let cardCss = \"\", badgeCss = \"background:var(--c-blue);color:#fff;\", badgeLabel = LETTERS[i];\n      if (answered) {\n        const t = TONE[o.status];\n        cardCss = \"cursor:default;\" + t.card;\n        badgeCss = t.badge;\n        badgeLabel = t.mark;\n        if (i === choice) cardCss += \"opacity:1;box-shadow:0 0 0 3px rgba(0,149,208,.24);\";\n      }\n      return { text: o.label, cardCss, badgeCss, badgeLabel, disabled: answered, onPick: () => this.pick(i) };\n    });\n\n    // Acteurs mobilises : ceux qu'une reponse attendue a permis de designer, etape 1 ou 2.\n    // Quelques etapes admettent deux acteurs attendus : repondre juste les credite tous les deux.\n    const goodIds = new Set();\n    Object.keys(S.answers).forEach(k => {\n      const p = k.split(\"-\");\n      const c = this.CASES[+p[0]];\n      const s = c && c.steps[+p[1]];\n      const o = s && s.options[S.answers[k]];\n      if (o && o.status === \"attendu\") {\n        s.options.forEach(x => { if (x.status === \"attendu\") goodIds.add(x.actor); });\n      }\n    });\n\n    const IMG = (typeof window !== \"undefined\" && window.ACTOR_IMAGES) || {};\n\n    const ficheButtons = stp.fiches.map(id => {\n      const lu = !!S.read[ci + \"-\" + st + \"-\" + id];\n      return {\n        id: id, name: A[id].name, family: this.FAMILY[id],\n        src: IMG[\"av-\" + id] || \"\",\n        css: lu ? \"background:var(--c-good-bg);border-color:#c3e5d3;\" : \"\",\n        action: lu ? \"fiche lue ✓\" : \"ouvrir la fiche ›\",\n        actionCss: lu ? \"color:var(--c-good);\" : \"color:var(--c-blue);\",\n        onOpen: () => this.openFiche(id)\n      };\n    });\n    const fichesLues = stp.fiches.every(id => S.read[ci + \"-\" + st + \"-\" + id]);\n\n    const fa = S.openActorId ? A[S.openActorId] : null;\n\n    const recapActors = Object.keys(A).map(key => {\n      const on = goodIds.has(key);\n      return {\n        id: key, name: A[key].name, src: IMG[\"av-\" + key] || \"\",\n        css: on ? \"background:var(--c-blue);color:#fff;\" : \"background:var(--c-line);color:var(--c-muted);\",\n        slotCss: on ? \"box-shadow:0 0 0 2px rgba(255,255,255,.6);\" : \"opacity:.5;\",\n        onOpen: () => this.openFiche(key)\n      };\n    });\n\n    const memoRow = (key) => ({\n      id: key, name: A[key].name, memo: this.MEMO[key],\n      css: goodIds.has(key) ? \"border-color:var(--c-blue);\" : \"\",\n      onOpen: () => this.openFiche(key)\n    });\n\n    const stepsDone = (idx) =>\n      (S.answers[idx + \"-0\"] !== undefined ? 1 : 0) + (S.answers[idx + \"-1\"] !== undefined ? 1 : 0);\n\n    const isLast = ci >= this.CASES.length - 1 && st === 1;\n    const tone = picked ? TONE[picked.status] : TONE.attendu;\n\n    return {\n      isHome: S.screen === \"home\",\n      isCases: S.screen === \"cases\",\n      isRecap: S.screen === \"recap\",\n      showChrome: S.screen !== \"home\",\n      chromeTitle: S.screen === \"cases\" ? \"Cas pratiques\" : \"Récapitulatif\",\n      goHome: this.goHome, goCases: this.goCases,\n\n      caseTotal: this.CASES.length,\n      actorTotal: Object.keys(A).length,\n      mobCount: goodIds.size,\n      mobWord: goodIds.size > 1 ? \"acteurs\" : \"acteur\",\n\n      caseId: cs.id,\n      caseNumPad: String(ci + 1).padStart(2, \"0\"),\n      caseTotalPad: String(this.CASES.length).padStart(2, \"0\"),\n      caseTag: cs.tag,\n      caseSituation: cs.situation,\n      caseQuestion: stp.question,\n      hasBlocage: !!stp.blocage,\n      caseBlocage: stp.blocage || \"\",\n      stepLabel: \"Étape \" + (st + 1) + \" / 2\",\n\n      homeHeroSrc: IMG[\"home-hero\"] || \"\",\n      caseSceneSrc: IMG[\"scene-\" + cs.id] || \"\",\n      cardAnim: ((ci * 2 + st) % 2 === 0 ? \"cardIn1\" : \"cardIn2\") + \" .4s cubic-bezier(.2,.8,.2,1) both\",\n      segs: this.CASES.map((_, i) => {\n        const n = stepsDone(i);\n        return { css: n === 2 ? \"background:var(--c-blue);\"\n              : n === 1 ? \"background:linear-gradient(90deg,var(--c-blue) 50%,var(--c-blue-light) 50%);\"\n              : (i === ci ? \"background:var(--c-blue-light);\" : \"background:var(--c-line);\") };\n      }),\n\n      options, answered,\n      verdictIcon: picked ? tone.mark : \"\",\n      verdictIconCss: tone.icon,\n      verdictTitle: picked ? tone.title : \"\",\n      explainText: picked ? picked.why : \"\",\n      retenirText: stp.retenir,\n      ficheButtons: ficheButtons,\n      ficheLabel: ficheButtons.length > 1 ? \"Les fiches à connaître\" : \"La fiche à connaître\",\n      nextBlocked: !fichesLues,\n      nextCss: fichesLues ? \"\" : \"background:var(--c-line);color:var(--c-muted);cursor:default;\",\n      chipAnim: (goodIds.size % 2 === 0 ? \"countPulseA\" : \"countPulseB\") + \" .45s ease\",\n      nextLabel: !fichesLues\n        ? (ficheButtons.length > 1 ? \"Ouvrez les fiches pour continuer\" : \"Ouvrez la fiche pour continuer\")\n        : (st === 0 ? \"Découvrir le blocage →\" : (isLast ? \"Voir le récapitulatif →\" : \"Situation suivante →\")),\n      nextCase: this.next,\n\n      ficheOpen: !!fa,\n      ficheId: S.openActorId || \"\",\n      ficheSrc: (S.openActorId && IMG[\"av-\" + S.openActorId]) || \"\",\n      ficheName: fa ? fa.name : \"\",\n      ficheFamily: fa ? this.FAMILY[S.openActorId] : \"\",\n      ficheWho: fa ? fa.who : \"\",\n      ficheLever: fa ? fa.lever : \"\",\n      ficheNot: fa ? fa.not : \"\",\n      closeFiche: this.closeFiche, stop: this.stop,\n\n      recapActors,\n      memoInternes: this.INTERNES.map(memoRow),\n      memoExternes: this.EXTERNES.map(memoRow)\n    };\n  }\n}\n<\u002Fscript>\n"
  </script>
